});

(function (root, factory) {
  'use strict';

  'use strict';

  // Keep the explanation beside its target whenever there is room. Otherwise
  // dock it below and let reveal() scroll the target into the remaining space.
  function placement(rect, width, height, viewportWidth, viewportHeight) {
    const gap = 18, edge = 12;
    const clamp = (value, max) => Math.max(edge, Math.min(value, max - edge));
    const beside = clamp(rect.top + (rect.height - height) / 2, viewportHeight - height);
    const across = clamp(rect.left + (rect.width - width) / 2, viewportWidth - width);
    if (viewportWidth >= 760) {
      if (rect.left - gap - width >= edge) return {left:rect.left - gap - width, top:beside, docked:false};
      if (rect.right + gap + width <= viewportWidth - edge) return {left:rect.right + gap, top:beside, docked:false};
      if (rect.bottom + gap + height <= viewportHeight - edge) return {left:across, top:rect.bottom + gap, docked:false};
      if (rect.top - gap - height >= edge) return {left:across, top:rect.top - gap - height, docked:false};
    }
    return {left:clamp((viewportWidth - width) / 2, viewportWidth - width), top:Math.max(edge, viewportHeight - height - edge), docked:true};
  }

  function start({steps, prepare, finish, help}) {
    const dialog = document.createElement('dialog');
    dialog.className = 'tour-dialog';
    dialog.setAttribute('aria-labelledby', 'tour-title');
    dialog.setAttribute('aria-describedby', 'tour-description');
    dialog.innerHTML = '<div class="tour-spotlight" aria-hidden="true"></div><section class="tour-card"><header class="tour-header"><span class="tour-counter"></span><button class="icon-button" data-tour="close" aria-label="Afslut introduktionen" title="Afslut introduktionen">×</button></header><div class="tour-progress" aria-hidden="true"><span></span></div><div class="tour-content"><h2 id="tour-title" tabindex="-1"></h2><div id="tour-description"></div></div><footer class="tour-footer"><div class="tour-navigation"><button class="button outline" data-tour="previous">Forrige</button><button class="button primary" data-tour="next">Næste →</button></div><div class="tour-footnote"><button class="text-button" data-tour="help">Læs hjælpen som tekst</button><span>Esc afslutter</span></div></footer></section>';

      let left = Math.max(6, original.left - 6), top = Math.max(6, original.top - 6);
      let right = Math.min(innerWidth - 6, original.right + 6), bottom = Math.min(innerHeight - 6, original.bottom + 6);

      Object.assign(card.style, {left:pos.left+'px', top:pos.top+'px'});

      find('#tour-title').textContent = step.title;
      find('#tour-description').innerHTML = step.body;
      find('.tour-content').scrollTop = 0;

    window.addEventListener('resize', reveal);

  }

  function fillHeightGuide(ast){
    const nodes=E.FillHeight.find(ast);
    if(!nodes.length)return '';
    return nodes.map((node,n)=>{
      const state=E.FillHeight.analyze(node,E.evaluate);
      const short=node.parts.map((p,i)=>E.FillHeight.shortBranch(node,i,state.parts?.[i]?.d));
      const equation=(tree,symbol,unit)=>`<div class="fill-equation">${displayMath(tree,symbol,unit)}</div>`;
      const steps=b=>`${equation(b.remaining,'V_rest','m³')}${equation(b.offset,'H_fyldt','m')}${b.local?equation(b.local,'h_del','m'):`<p>Find h_del mellem 0 og ${esc('H_del'+(node.parts.indexOf(b.part)+1))}, så denne ligning passer:</p>${equation(b.equation,'V_rest','m³')}<p class="field-note">Prøv en højde, beregn rumfanget, og justér højden op eller ned. Halvér intervallet mellem for lav og for høj, indtil højden er præcis nok.${b.part.type==='halfCylinder'?' Brug acos (cos⁻¹) i <strong>radianer</strong>, dvs. RAD på TI-30.':''}</p>`}${equation(b.ast,'H_x','m')}`;
      const active=state.status==='ready'?short[state.active]:null;
      const rows=short.map((b,i)=>`<li class="fill-part ${state.status==='ready'&&i===state.active?'fill-active':''}"><div class="fill-part-heading"><strong>${i+1}. ${esc(b.part.name)}</strong><span>${state.status==='ready'?(i<state.active?'Helt fyldt':i===state.active?(state.remaining===state.parts[i].capacity?'Fyldt til kanten':state.remaining===0?'Tom · start her':'Her ligger væskeoverfladen'):'Endnu tom'):'Del '+(i+1)}</span></div>${equation(b.capacity,'V_del'+(i+1),'m³')}${equation(b.h,'H_del'+(i+1),'m')}<details data-detail-key="fill-branch-${n}-${b.part.id}"><summary>Delvis fyldning af denne del</summary><p>Brug denne gren, når alle dele nedenunder er fulde, og restvolumen er mellem 0 og V_del${i+1}.</p>${steps(b)}</details></li>`).join('');
      const warning=state.status==='error'?`<p class="error-box" role="status">${esc(state.error)}</p>`:state.status==='incomplete'?'<p class="fill-status" role="status">Angiv produktets volumen og tankens indvendige mål under <strong>Størrelserne i formlen</strong>. Så markeres den del, hvor væskeoverfladen ligger. Indtil da kan du bruge grenene nedenfor.</p>':`<p class="fill-status" role="status">${state.volume===0?'Tanken er tom.':state.volume>=state.total?'Tanken er helt fyldt.':'Væskeoverfladen ligger i del '+(state.active+1)+': '+esc(active.part.name)+'.'}</p>`;
      return `<section class="fill-height-guide" aria-label="Hx · fyldning fra bunden"><h3>Hx · fra bunden og op</h3><p>Højden måles fra tankens laveste indvendige punkt. Fyld de nederste dele først, træk deres rumfang fra produktvolumen, og læg deres højder til højden i den næste del.</p><p class="field-note">${node.inverted?'I denne Hx-formel er tanken vendt på hovedet i forhold til figurvisningen.':'Rækkefølgen følger den lodrette samling i figurvisningen.'} Hx bruger netop denne samling; separate tanke tælles ikke med.</p>${warning}<ol class="fill-parts">${rows}</ol>${active?`<div class="fill-current"><h4>Delberegninger for den aktuelle fyldning</h4>${steps(active)}</div>`:''}<p class="field-note">TI-30: Beregn V_del og H_del for hver relevant del separat. Brug derefter V_rest, H_fyldt og h_del ovenfor. Formlerne kan blive for lange i én indtastning; brug hukommelsesvariable og afrund først det endelige svar. Alle deltrin her bruger m³ og m; resultatets enhed vælges nedenfor.</p><p class="field-note">Hx er geometrisk: tanken skal stå lodret og kunne holde på produktet. Åbne sider eller bunde begrænser ikke automatisk rumfanget. Indvendige skilleplader, hældning, rørforbindelser mellem separate tanke og overløb indgår ikke.</p></section>`;
    }).join('');

  function fillHeightCopy(ast){

  function formatResultValue(value){
    // The requested precision counts three digits in the fractional part,
    // starting at its first nonzero digit: 2.003234 -> 2.00323. Expand the
    // shortest decimal representation before rounding, avoiding binary scaling,
    // exponent notation and the fraction-digit limits of Intl/toFixed.
    const [coefficient,exponent='0']=Math.abs(value).toString().split('e');
    const [whole,tail='']=coefficient.split('.'),digits=whole+tail,point=whole.length+Number(exponent);
    const integer=point<=0?'0':digits.slice(0,point)+'0'.repeat(Math.max(0,point-digits.length));
    const fraction=point<=0?'0'.repeat(-point)+digits:digits.slice(point);
    const places=Math.max(0,fraction.search(/[1-9]/))+3;
    let rounded=BigInt(integer+fraction.slice(0,places).padEnd(places,'0'));
    if(fraction[places]>='5')rounded+=1n;
    const text=rounded.toString().padStart(places+1,'0');
    const resultWhole=text.slice(0,-places),resultFraction=text.slice(-places);
    // A carry can move the first nonzero digit left (0.009999 -> 0.0100).
    const resultPlaces=Math.max(0,resultFraction.search(/[1-9]/))+3;
    return (value<0?'-':'')+resultWhole+','+resultFraction.slice(0,resultPlaces);
  }

  function unitSelector(dimension,unit,action,id,symbol='',owner='') {

    const labelledPart=ratio.numerator.length>1?'numerator':'denominator';
    const selectPart=part=>{
      const options=ratio[part].map(u=>{
        const name=part==='denominator'&&ratio.groupDenominator?'('+u.label+')':u.id==='ton'?'t (ton)':u.label;

    const from={shape:host.id,face:face[0]},choices=[];
    for(const s of model.shapes)for(const [key,f]of freeFaces(s))if(!E.canConnect(model,from,{shape:s.id,face:key}))choices.push({value:`existing:${s.id}:${key}`,label:`${s.name} · ${f.label}`,group:'Figurer i opsætningen'});
    if(model.shapes.length<24)for(const [type,s]of Object.entries(E.SHAPES))for(const [key,f]of Object.entries(s.faces))if(f.join&&f.kind===face[1].kind)choices.push({value:`new:${type}:${key}`,label:`Ny ${s.name.toLowerCase()} · ${f.label}`,group:'Indsæt og sammensæt'});
    if(!choices.some(c=>c.value===joinDraft.target))joinDraft.target=choices.find(c=>c.value===(face[1].kind==='rectangle'?'new:halfCylinder:top':'new:hemisphere:base'))?.value||choices[0]?.value||'';
    const endNote=face[1].kind==='rectangle'?'Til kassens bund kan du vælge en halvcylinder (rundbund), en V-bund med to trekantsender eller en pyramide med én spids. Længden følger kassens længde. Halvcylinderens diameter følger kassens bredde.':'En halvkugle er et kugleformet endestykke med højde D / 2. Samlinger forbinder hele, passende endeflader.';
    return `<div class="join-fields"><label>På hvilken figur?<select data-action="join-host">${hosts.map(s=>`<option value="${esc(s.id)}" ${s.id===host.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><label>På hvilken ende?<select data-action="join-face">${faces.map(([key,f])=>`<option value="${key}" ${key===joinDraft.face?'selected':''}>${esc(f.label)}</option>`).join('')}</select></label><label>Sæt denne figur på<select data-action="join-target">${choices.length?['Figurer i opsætningen','Indsæt og sammensæt'].map(group=>`<optgroup label="${group}">${choices.filter(c=>c.group===group).map(c=>`<option value="${esc(c.value)}" ${c.value===joinDraft.target?'selected':''}>${esc(c.label)}</option>`).join('')}</optgroup>`).join(''):'<option value="">Ingen ledige, passende endeflader</option>'}</select></label><div class="join-explanation">Samlefladerne får samme indvendige mål fra den første figur. Fladerne tælles ikke med i pladearealet. Når delene skilles ad, bruges igen hver figurs egne mål og åbne/lukkede valg.</div><p class="field-note">${esc(endNote)}</p></div>`;
  }
  function openJoin(id,face) {
    joinDraft={host:id||(selected?.type==='shape'?selected.id:''),face:face||'',target:''};
    const body=joinFields();
    openDialog('Sammensæt figurer',body,'<button class="button outline" data-action="close-dialog">Annullér</button><button class="button primary" data-action="confirm-join">Sæt sammen</button>');
  }
  function commitJoin() {
    if(!joinDraft?.target){notify('Vælg en figur med en passende, ledig endeflade.');return;}
    const next=E.clone(model),[kind,key,face]=joinDraft.target.split(':');let child;
    if(kind==='existing')child=next.shapes.find(s=>s.id===key);
    else if(kind==='new'&&Object.hasOwn(E.SHAPES,key)&&next.shapes.length<24){
      child=E.newShape(key,newId('shape'),Math.max(0,...next.shapes.map(s=>s.ordinal))+1);
      const n=next.shapes.filter(s=>s.type===key).length;if(n)child.name+=' '+(n+1);next.shapes.push(child);
    }
    if(!child){notify('Figuren kan ikke tilføjes.');return;}
    try {
      const candidate=E.connect(next,{shape:joinDraft.host,face:joinDraft.face},{shape:child.id,face},newId('joint'));
      closeDialog();model=candidate;save();select('shape',child.id);notify('Figurerne er samlet. De fælles endeflader er udeladt fra overfladen.');
    }catch(error){notify(error.message);}
  }
  function useAssembly(dimension,shapeId) {
    const ids=shapeId?E.component(model,shapeId):[];
    let f=model.formulas.find(f=>f.dimension===dimension&&f.expression.kind==='assembly'&&(shapeId?ids.includes(f.expression.shapeId):!f.expression.shapeId)&&!f.expression.property);
    if(!f){
      if(model.formulas.length>=40){notify('Der er allerede 40 formler i opsætningen.');return;}
      f=E.newFormula(newId('formula'),dimension==='volume'?'volumeSum':'areaSum');f.expression=E.assembly(dimension,undefined,shapeId);f.symbol=dimension==='volume'?'V_samlet':'A_plade';f.name=(dimension==='volume'?'Rumfang':'Pladeareal')+' · '+(shapeId?model.shapes.filter(s=>ids.includes(s.id)).map(s=>s.name+' ('+s.ordinal+')').join(' + '):'alle valgte dele');f.name=f.name.slice(0,120);if(shapeId)f.symbol=(dimension==='volume'?'V':'A')+'_figur'+model.shapes.find(s=>s.id===shapeId).ordinal;if(active()?.groupId)f.groupId=active().groupId;model.formulas.push(f);save();
    }
    select('formula',f.id);
  }

    pending=()=>{model=candidate;valueDrafts=new Map();activeId=model.formulas.at(-1)?.id||null;selected=activeId?{type:'formula',id:activeId}:null;save();changeView('builder');render();};
    openDialog(title,'<p>Din nuværende opsætning bliver erstattet. Gem den først, hvis du vil beholde den separat.</p>','<button class="button outline" data-action="close-dialog">Annullér</button><button class="button primary" data-action="confirm">Erstat opsætning</button>');
  }
  function customFormulaDialog(path,dimension){
    const expr=getAt(path);if(expr?.kind!=='custom')return;
    const f=path.length===3&&path[0]==='formulas'?model.formulas[path[1]]:null;
    openDialog('Redigér egen formel',`${f?`<label class="field-label">Resultatets symbol<input class="source-select" data-custom-symbol value="${esc(f.symbol)}" maxlength="24" required></label><label class="field-label">Resultatets størrelse<select class="source-select" data-custom-result>${Object.entries(E.DIMENSIONS).map(([key,d])=>`<option value="${key}" ${key===f.dimension?'selected':''}>${esc(d.name)} · ${esc(d.unit)}</option>`).join('')}</select></label>`:''}<label class="field-label">Formlens højreside<textarea class="source-select custom-source" data-custom-text maxlength="500" rows="4" spellcheck="false" required>${esc(expr.text)}</textarea></label><p class="field-note">Fx <strong>h_top + h_midte + h_bund</strong> eller <strong>(V_total - V_top - V_bund) / A</strong>. Brug +, -, *, /, ^, parenteser, pi eller sqrt(...). Skriv kun højresiden, uden lighedstegn.</p><p class="field-note">Symboler kan have indeks med _, fx h_top. Tal i udtrykket er enhedsløse. Tal med enheder angives via symbolernes inputfelter. Bagefter vælger du kilden og størrelsen for hvert symbol. Eksisterende forbindelser bevares for uændrede symbolnavne.</p><p class="inline-error" data-custom-error role="status"></p>`,`<button class="button outline" data-action="close-dialog">Annullér</button><button class="button primary" data-action="save-custom" data-path="${pathAttr(path)}" data-dimension="${dimension}">Anvend udtryk</button>`);
    $('#app-dialog').querySelector('[data-custom-text]').focus();
  }
  function saveCustomFormula(path,dimension){
    const dialog=$('#app-dialog'),text=dialog.querySelector('[data-custom-text]').value;
    const previous=E.clone(model),f=path.length===3&&path[0]==='formulas'?model.formulas[path[1]]:null;
    try{
      if(f){
        const symbol=dialog.querySelector('[data-custom-symbol]').value.trim();
        if(!E.CustomFormula.validSymbol(symbol))throw new Error('Brug et symbol med bogstaver, evt. tal og ét indeks efter _, fx H_total.');
        dimension=dialog.querySelector('[data-custom-result]').value;
        if(f.dimension!==dimension)delete f.resultUnit;
        f.dimension=dimension;f.symbol=symbol;
      }
      setAt(path,E.customExpression(text,dimension,getAt(path).args));
      model=E.validateModel(model);save();closeDialog();expanded=true;render();notify('Udtrykket er gemt. Vælg størrelser og kilder for symbolerne.');
    }catch(error){model=previous;dialog.querySelector('[data-custom-error]').textContent=error.message;}
  }
  function formulaPicker(groupId=active()?.groupId||'') {
    const groups=[...new Set(Object.values(E.BASE_FORMULAS).map(f=>f.group))];
    openDialog('Hvad vil du finde?','<p>Vælg en grundformel. Under Isolér en størrelse kan du bagefter vælge en anden ukendt.</p><div class="dialog-formula-list"><button class="dialog-formula-item" data-action="use-formula" data-formula="custom" data-group="'+esc(groupId)+'"><span>Egen formel</span><span>Skriv fx h_top + h_midte + h_bund, og forbind symbolerne</span></button><button class="dialog-formula-item" data-action="use-formula" data-formula="figureMeasure" data-group="'+esc(groupId)+'"><span>Mål i samlet figur</span><span>Isolér højde, bredde eller længde</span></button><button class="dialog-formula-item" data-action="use-formula" data-formula="fillHeight" data-group="'+esc(groupId)+'"><span>Produkthøjde i tank (Hx)</span><span>Fyld sammensatte figurer fra bunden</span></button>'+groups.map(group=>`<h3>${esc(group)}</h3>${Object.entries(E.BASE_FORMULAS).filter(([,f])=>f.group===group).map(([id,f])=>`<button class="dialog-formula-item" data-action="use-formula" data-formula="${id}" data-group="${esc(groupId)}"><span>${esc(formulaTitle(f))}</span><span>${esc(f.equation)}</span></button>`).join('')}`).join('')+'</div>');
  }
  function addFormula(id,groupId=active()?.groupId||'') {
    if (model.formulas.length>=40) {notify('Der kan højst være 40 formler i én opsætning.');return;}
    const key=newId('formula');
    const f=id==='custom'?E.newCustomFormula(key):id==='figureMeasure'?E.newFigureMeasure(model,key):id==='fillHeight'?E.newFillHeight(key,E.components(model).length===1?model.shapes[0]?.id||'':''):['tankMass','tankMassSurfaces'].includes(id)?E.newTankMass(model,key,id==='tankMassSurfaces'):id==='filledTankMass'?E.newFilledTankMass(model,key):E.newFormula(key,id);
    if(model.formulas.some(other=>other.symbol===f.symbol)){
      const base=f.symbol.replace(/_/g,'');let n=2;
      while(model.formulas.some(other=>other.symbol===base+'_'+n))n++;
      f.symbol=base+'_'+n;f.name+=' '+n;
    }
    // Reuse an unambiguous existing quantity for the two standard fill-time inputs.
    if(id==='fillTime')for(const [key,dim]of [['V','volume'],['Q','flow']]){
      const candidates=model.formulas.filter(other=>other.dimension===dim);
      if(candidates.length===1)f.expression.args[key]=E.ref('formula:'+candidates[0].id);
    }
    model.formulas.push(f);if(groupId)model=E.assignFormulaGroup(model,f.id,groupId);save();select('formula',f.id,true);
  }
  function addShape(type) {
    if(model.shapes.length>=24){notify('Der kan højst være 24 figurer i én opsætning.');return;}
    const ordinal=Math.max(0,...model.shapes.map(s=>s.ordinal))+1;
    const s=E.newShape(type,newId('shape'),ordinal), same=model.shapes.filter(other=>other.type===type).length;
    if(same)s.name+=' '+(same+1);
    model.shapes.push(s);save();select('shape',s.id,true);
  }
  function remove(type,id) {
    const list=type==='shape'?model.shapes:model.formulas, object=list.find(o=>o.id===id);
    if(!object)return;
    const users=E.usersOf(model,type,id);
    pending=()=>{if(type==='shape')model=E.removeShape(model,id);else list.splice(list.indexOf(object),1);if(activeId===id)activeId=model.formulas.at(-1)?.id||null;selected=activeId?{type:'formula',id:activeId}:null;save();render();notify(object.name+' er fjernet.');};
    openDialog('Fjern '+object.name+'?',users.length?`<p>Disse formler bruger elementet:</p><ul>${users.map(name=>`<li>${esc(name)}</li>`).join('')}</ul><p>Samlinger løsnes, og de resterende figurer beholder deres egne mål og fladevalg. Direkte referencer til det fjernede element markeres, så du kan vælge en ny kilde.</p>`:'<p>Elementet fjernes fra opsætningen.</p>','<button class="button outline" data-action="close-dialog">Annullér</button><button class="button danger" data-action="confirm">Fjern</button>');
  }
  function exportSetup() {
    const blob=new Blob([JSON.stringify(model,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=(model.title.replace(/[^\p{L}\p{N}_-]+/gu,'-').replace(/^-|-$/g,'')||'opsaetning')+'.pp.json';
    document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('Opsætningen er hentet som en fil.');

  async function copyFormula() {
    const f=active();if(!f)return;
    const ctx=E.context(model),r=ctx.safe('formula:'+f.id,expanded?'expanded':'compact',true);if(!r.ok)return;
    const quantities=E.variables(r.ast).map(v=>v.symbol+(quantityOwner(v)?' ('+quantityOwner(v)+')':'')+': '+(valueDisplay!=='units'&&v.inputValue!==undefined?v.inputValue.replace('.',',')+' ':'')+(v.reference?E.resultUnit(ctx.map.get(v.reference)):E.inputUnit(model,v)).label);
    const text=f.symbol+' ['+E.resultUnit(f).label+'] = '+E.plain(r.ast,null,valueDisplay)+(E.FillHeight.find(r.ast).length?'\n\n'+fillHeightCopy(r.ast):'')+(quantities.length&&valueDisplay==='both'?'\n\nStørrelser og enheder:\n'+quantities.join('\n'):'');
    try { if(!navigator.clipboard?.writeText)throw new Error('Unavailable');await navigator.clipboard.writeText(text);notify('Formlen er kopieret.'); }
    catch(_) {
      const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();let success=false;
      try{success=document.execCommand('copy');}catch(_){}area.remove();
      if(success)notify('Formlen er kopieret.');
      else openDialog('Kopiér formlen',`<p>Markér teksten og tryk Ctrl+C:</p><textarea class="copy-fallback" readonly aria-label="Formel til kopiering">${esc(text)}</textarea>`);
    }
  }
  function showHelp() {
    openDialog('Sådan bruger du kompendiet','<h3>Fra opgave til formel</h3><ol><li>Vælg, hvad du vil finde, fx fyldetid, rumfang eller flow.</li><li>Indsæt de figurer, opgaven består af. Vælg, hvilke der indgår i beholderen.</li><li>Ved hver størrelse vælger du <strong>Kendt størrelse</strong>, en <strong>formel</strong> eller en <strong>reference</strong>. Under <strong>Størrelserne i formlen</strong> kan du beholde symbolerne eller skrive opgavens tal.</li><li>Skift mellem <strong>Kort</strong> og <strong>Udfoldet</strong>, og se den samlede formel. Under <strong>Se formelkæden</strong> kan du følge de enkelte formler.</li></ol><h3>Rækkefølge og grupper</h3><p>Brug ↑ og ↓ under en formel i venstremenuen for at flytte den op eller ned i sin gruppe. <strong>Opret gruppe</strong> laver en navngivet gruppe; dropdown-menuen under hver formel flytter den til en gruppe eller tilbage til <strong>Uden gruppe</strong>. Grupper har egne flytteknapper og kan foldes sammen med overskriften. <strong>Redigér</strong> omdøber eller fjerner en gruppe; formlerne bevares, når gruppen fjernes.</p><p>Nye formler oprettes i den aktive formels gruppe. <strong>Tilføj formel her</strong> vælger en bestemt gruppe. Grupper, rækkefølge og sammenfoldning følger med i gemte opsætninger. Referencer følger fortsat formlernes identitet.</p><h3>Omskriv en formel</h3><p>Vælg <strong>Isolér en størrelse</strong> over formelvisningen. Fx bliver v = π · D · n til n = v / (π · D). Der oprettes en ny formel med de øvrige input og referencer, og den hidtidige venstreside bliver et kendt input. Tjek de valgte enheder. Rodvalg og særlige forudsætninger står ved omskrivningen. Alle grundformler kan omskrives; enkelte størrelser kræver en anden metode, som forklares ved valget.</p><h3>Eksempel: bassin med keglebund</h3><p>Fyldetiden bruger t = V / Qᵥ. Rumfanget hentes fra cylinder + keglebund. Flowet kan beholdes som Qᵥ, eller foldes ud til A · v, hvor A kommer fra rørets diameter. Klik på keglebunden for at se dens fælles diameter med cylinderen.</p><h3>Figurer og symboler</h3><p>Hver figur får et nummer. D₁ er diameteren på figur 1, h₂ er højden på figur 2. En reference følger kilden, når du ændrer den. <strong>Indsæt formlen her</strong> kopierer kildens aktuelle formel, så du kan tilpasse den herfra.</p><h3>Sammensæt og se figurerne</h3><p>Tryk <strong>Sammensæt</strong>, vælg en figur og en fri endeflade, og sæt en eksisterende eller ny figur på. Brug fx en <strong>halvkugle</strong> som kuglespids på en cylinder. Delene får fælles mål, og deres samleflader fjernes automatisk fra pladearealet. Hele samlingen indgår i beholderens sum, når den er valgt.</p><p>I <strong>3D</strong> kan du trække for at dreje og scrolle for at zoome. Du kan også bruge piletasterne samt + og −, når visningen har fokus. <strong>Skitse</strong> viser fladernes navne og status. Begge visninger er skematiske og uden målestok.</p><p>Vælg en figur for at sætte hver fri flade til <strong>Åben</strong> eller <strong>Lukket</strong>. Valget ændrer overfladeformlen, mens det geometriske rumfang er det samme. Brug <strong>Skil ad</strong> til at løsne en samling eller <strong>Fjern</strong> under figurens kort til at slette den. Samlede rumfang og arealer findes under visningen. Rumfang må kun summeres for dele, der ikke overlapper.</p><h3>Rundbund, V-bund eller pyramide under en kasse</h3><p>Vælg <strong>Sammensæt → Kasse → Bund</strong> og derefter <strong>Ny halvcylinder</strong>, <strong>Ny v-bund</strong> eller <strong>Ny pyramide</strong>. Halvcylinderen har to flade halvcirkelformede ender. V-bunden er et symmetrisk trekantet prisme med to flade trekantsender. Pyramiden har en rektangulær snitflade og fire sider til én spids under centrum.</p><p>Samlingen deler længde og bredde med kassen; halvcylinderens diameter er kassens indvendige bredde. Den fælles rektangulære flade udelades fra arealet. Vælg åbne/lukkede ender og eventuelle skrå plader på bundfiguren. Dybden er D / 2 for halvcylinderen; på V-bund og pyramide angiver h den lodrette dybde under kassen. Rumfang og pladeareal følger med i de samlede formler og T9.</p><h3>Indvendig eller udvendig diameter</h3><p>Vælg figuren og angiv, om diameteren er <strong>indvendig</strong> eller <strong>udvendig</strong>. Rumfang, flow og pladeareal bruger indvendige mål. En udvendig diameter omregnes som <strong>Dindre = (Dydre − 2 · tradial)</strong>. Højde og længde skal fortsat være indvendige mål. Samlede figurer deler den indvendige diameter, så godstykkelsen ikke trækkes fra to gange.</p><p>Cylinder, rør og kugledele bruger som standard samme pladetykkelse som T9. På kegler og keglestubbe angives radial godstykkelse ved endefladen særskilt; den er forskellig fra tykkelsen vinkelret på den skrå plade. T9 er fortsat skolens tyndplademodel med indvendigt pladeareal.</p><h3>Vælg visning</h3><p>Brug den tredelte knap <strong>Værdier · Enheder · Begge</strong> ved formlen. Værdier viser fx 30 · 50; Enheder viser L · B; Begge viser tal med små enheds- og symbolmærker. Tomme talfelter vises som symboler i Værdier. Faste tal og omregningsfaktorer bevares, og resultatets enhed står fortsat ved venstresiden.</p><p>Valget ændrer kun visningen og gælder også formelkæden, delberegninger og kopiering. Det huskes i browseren. TI-30-skønnet bruger dine indtastede tal i alle tre visninger.</p><h3>Indsæt tal i formlen</h3><p>Under <strong>Størrelserne i formlen</strong> kan du skrive et tal i feltet <strong>Tal (valgfrit)</strong>. Fx viser B = 50 og L = 30 tallene med <strong>m (B)</strong> og <strong>m (L)</strong> i mindre tekst. Mærkerne fortæller, hvad tallene betyder; de skal ikke tastes på lommeregneren. Tomme felter viser symbolerne. Brug <strong>Ryd</strong> til at fjerne et tal.</p><p>Du kan bruge komma eller punktum som decimaltegn, også med negative tal. Hver selvstændig formel og figur har egne tal og inputenheder. Indsatte underformler deler værdier inden for samme formel; referencer følger deres kilde. Skifter du enhed, beholdes det indtastede tal, og formlens omregning tilpasses. Tal følger med i referencer, kopieret tekst og gemte opsætninger. TI-30-skønnet bruger tallenes faktiske længde. Resultatet beregner du selv.</p><h3>Enheder i opgaven og i resultatet</h3><p>Under <strong>Størrelserne i formlen</strong> vælger du den enhed, opgaven giver for hvert kendt symbol. Brøkenheder har to dropdowns: vælg tæller og nævner hver for sig, fx <strong>t (ton) / m³</strong>, <strong>kg / h</strong> eller <strong>mg / min</strong>. Det gælder også resultatets enhed. Med indtastede tal vises fx <strong>20 mm → 0,02 m</strong> direkte i formlen. Tomme felter beholder symbolet og omregningen. Modgående enhedsfaktorer forkortes automatisk i den samlede formel: med omdrejningstal i omdr./min og båndhastighed i m/min forsvinder de to faktorer på 60. Brug tallet fra opgaven direkte, og tilføj ikke SI-referencens omregning en gang til. Areal- og rumfangsenheder får deres egne faktorer.</p><p>Vælg <strong>Resultatets enhed</strong> nederst, fx liter, minutter, ton eller kW. Hele resultatet omregnes med de nødvendige parenteser. Procent kan vælges for forhold som virkningsgrad. °C omregnes til K for temperaturer; en temperaturforskel i °C har samme tal som i K.</p><p>Enhedsvalg er lokale for hver formel og figur. Referencer bruger kildens enheder. Hver formel har sin egen resultatenhed. Referencer omregnes én gang, og kopieret tekst viser de valgte enheder. Ændringer i enheder viser automatisk den udfoldede formel.</p><h3>Offline og gemte opsætninger</h3><p>Åbn <strong>index.html</strong> fra den downloadede mappe. Den indeholder hele kompendiet og virker uden installation, internet, login eller AI. Tal kan indsættes i formlen som hjælp til din egen indtastning på lommeregneren; standardvisningen viser formlen, så du kan regne videre på din lommeregner.</p><p><strong>Gem opsætning</strong> henter en fil med dine figurer og formelvalg. Åbn den igen med <strong>Åbn opsætning</strong>. Gem som fil, før du flytter til en anden computer; browserens lokale lagring er en ekstra bekvemmelighed.</p><p>Formlerne omfatter geometri, overflade, flow, tid, masse, tryk og pumpeeffekt. Følg opgavens forudsætninger og brug ensartede enheder.</p>');
  }
  const tutorialSteps = [
    {section:'OVERBLIK', title:'Velkommen til kompendiet', target:'.help-button', scene:'parts', body:'<p>Her får du en rundtur fra figurer til den færdige formel. Tryk <strong>Næste</strong> for at fortsætte; du behøver ikke betjene felterne undervejs.</p><p>Vi viser et midlertidigt bassin-eksempel. Når du afslutter, kommer din egen opsætning tilbage. Du kan altid starte igen med <strong>?</strong>.</p>'},
    {section:'FIGURER', title:'Indsæt de figurer, du skal bruge', target:'#shape-library', scene:'parts', body:'<p>Tryk på en figur i værktøjskassen for at indsætte den. Du kan fx bygge en tank af en <strong>cylinder</strong> og en <strong>kegle</strong>.</p><p>Til en kasse kan du vælge <strong>Halvcylinder</strong> som rundbund, <strong>V-bund</strong> med to trekantsender eller <strong>Pyramide</strong> med én spids. En halvkugle bruges som kuglespids på en cylinder.</p>'},
    {section:'FIGURER', title:'Vælg, tilpas eller fjern en figur', target:'#figure-tray', scene:'parts', focus:'cylinder', body:'<p>Tryk på figurens kort for at åbne dens indstillinger i panelet <strong>Tilpas figuren</strong>. Nummeret knytter dens symboler til figuren: D₁ og h₁ hører fx til figur 1.</p><p><strong>Fjern</strong> under kortet sletter figuren og løsner dens samlinger. Eventuelle direkte referencer til den skal derefter have en ny kilde.</p>'},
    {section:'FIGURER', title:'Hvad skal tælles med i beholderen?', target:'.include-choice', scene:'parts', focus:'pipe', body:'<p><strong>Indgår i beholderens sum</strong> bestemmer, hvilke dele der bidrager til tankens samlede rumfang og pladeareal.</p><p>Her er indløbsrøret fravalgt. Vi bruger dets tværsnit til flow, men tæller det ikke med i bassinet. For sammenføjede dele gælder valget hele samlingen. Under figuren kan du også vælge <strong>Brug rumfang</strong> eller <strong>Brug pladeareal</strong> for kun én figur. En sammensat figur tæller som én og kan vælges direkte i kildemenuerne.</p>'},
    {section:'FIGURER', title:'Vælg indvendig eller udvendig diameter', target:'.diameter-settings', scene:'parts', focus:'cylinder', body:'<p>Angiv, om opgavens diameter er <strong>indvendig</strong> eller <strong>udvendig</strong>. Ved et udvendigt mål vælger du også godstykkelsen, så den indvendige diameter kan udtrykkes korrekt.</p><p>Rumfang og flow bruger indvendige mål. Højde og længde skal fortsat være indvendige. Sammenføjede dele deler deres indvendige mål.</p>'},
    {section:'FIGURER', title:'Åbn eller luk toppen', target:'.face-list', scene:'parts', focus:'cylinder', body:'<p>Hver fri flade har en menu med <strong>Åben</strong> og <strong>Lukket</strong>. Her er cylinderens top åben. Vælger du Lukket, lægges toppladens areal til.</p><p>Valget ændrer <strong>pladearealet</strong> og dermed fx materialemassen. Figurens geometriske rumfang er det samme. En sammenføjet flade styres af samlingen.</p>'},
    {section:'SAMLINGER', title:'Forbind to figurer', target:'.join-button', scene:'parts', focus:'cylinder', body:'<p>Tryk <strong>Sammensæt</strong> for at sætte en figur på en anden. Du kan også vælge <strong>Sæt figur på denne ende</strong> ved en fri flade i figurens indstillinger.</p><p>På næste trin viser vi menuen med cylinderens bund og keglebunden valgt.</p>'},
    {section:'SAMLINGER', title:'Vælg figur, ende og endestykke', target:'.join-fields', scene:'join', focus:'cylinder', body:'<p>Vælg først <strong>Cylinder</strong>, derefter <strong>Bund</strong> og til sidst <strong>Keglebund · Plan endeflade</strong>. Tryk normalt <strong>Sæt sammen</strong> for at forbinde dem.</p><p>Menuen tilbyder både eksisterende figurer og nye endestykker, fx <strong>Ny halvkugle</strong>. Kun passende, ledige samleflader kan vælges. Vi viser resultatet på næste trin.</p>'},
    {section:'SAMLINGER', title:'Se den samlede figur i 3D', target:'.solid-viewer', body:'<p>Nu sidder keglen på cylinderens bund. Træk i <strong>3D-visningen</strong> for at dreje den; brug scroll eller +/− til zoom. <strong>Skitse</strong> viser et snit med fladernes navne.</p><p>Visningen følger samlinger og åbne/lukkede flader. Den er skematisk og uden målestok.</p>'},
    {section:'SAMLINGER', title:'Fælles flader og samlede formler', target:'.assembly-totals', detail:'assembly-totals', body:'<p>Her finder du det samlede <strong>rumfang</strong> og <strong>pladeareal</strong>. Åbne flader og de to endeflader i en samling udelades automatisk fra pladearealet. <strong>Brug formel</strong> føjer summen til Mine formler.</p><p><strong>Skil ad</strong> under visningen løsner samlingen. Delene får deres egne mål og fladevalg tilbage. Sum af rumfang forudsætter, at delene ikke overlapper.</p><p>Vælg <strong>Isolér højde, bredde eller længde</strong> for at finde et mål ud fra det kendte samlede rumfang eller pladeareal. Fælles mål i samlinger behandles som én ukendt. Du kan også vælge <strong>Isolér et mål i figurerne</strong> på en gemt figurformel.</p>'},
    {section:'FORMLER', title:'Vælg, hvad du vil finde', target:'.goal-row', body:'<p>Her vælger du hovedformlen. I eksemplet vil vi finde <strong>Fyldetid</strong>: t = V / Qᵥ.</p><p>Menuen viser både dine egne formler og muligheden for at tilføje en ny. Figurerne leverer fx rumfanget V, mens en anden formel kan levere volumenflowet Qᵥ.</p><p>Vælg <strong>Produkthøjde i tank (Hx)</strong>, når du kender produktvolumen. Vælg den samlede tank i højre side. Hx følger delene fra bunden, bruger restvolumen i den næste del og viser delberegningerne.</p>'},
    {section:'FIGURER', title:'Særskilt tykkelse for sider og bund', target:'.plate-settings', scene:'parts', focus:'cylinder', detail:'plates-cylinder', body:'<p>Under <strong>Pladetykkelser</strong> vælger du en fælles sidetykkelse og eventuelt en anden tykkelse for bund, top eller en bestemt flade. Vælg <strong>Kendt størrelse</strong> for at bruge fx t_side og t_bund.</p><p>Brug <strong>Tankmasse med separate pladetykkelser</strong> i formelsamlingen. Den summerer areal gange tykkelse for de lukkede flader. Åbne og sammenføjede flader tæller ikke med.</p>'},
    {section:'OVERBLIK', title:'Sæt formlerne i rækkefølge og grupper', target:'#saved-formulas', scene:'organize', body:'<p>Brug <strong>↑ og ↓</strong> under en formel for at flytte den i sin gruppe. Dropdown-menuen flytter formlen til en anden gruppe eller <strong>Uden gruppe</strong>.</p><p><strong>Opret gruppe</strong> giver en ny gruppe. Gruppen har også flytteknapper, og overskriften folder indholdet sammen. <strong>Redigér</strong> ændrer navnet eller fjerner gruppen; formlerne bliver bevaret. Rækkefølge og grupper gemmes med opsætningen.</p>'},
    {section:'FORMLER', title:'Find formler fra formelsamlingen', target:'.formula-search', scene:'library', body:'<p>Fanen <strong>Formelsamling</strong> samler formlerne fra jeres materiale. Søg på et navn, symbol eller T-nummer, fx <strong>Pvirk</strong>, <strong>eta</strong> eller <strong>T9</strong>.</p><p>Kortene viser formlen, forudsætninger og henvisning til siden i jeres samling. Tryk <strong>Brug formel</strong> for at arbejde videre med den.</p>'},
    {section:'FORMLER', title:'Gem delformler, der kan bruges igen', target:['#saved-formulas','.goal-row'], body:'<p><strong>Mine formler</strong> samler opsætningens delformler. Her har vi rumfang, volumenflow og fyldetid. På en smal skærm vælger du dem i <strong>Hvad vil du finde?</strong>.</p><p>Brug <strong>Tilføj formel</strong> til nye delformler, og giv dem et genkendeligt navn i tilpasningspanelet. De kan derefter vælges som referencer.</p>'},
    {section:'EGNE FORMLER', title:'Skriv en egen formel med referencer', target:'#inspector .custom-expression', scene:'custom', body:'<p>Vælg <strong>Tilføj formel → Egen formel</strong> og skriv højresiden under <strong>Redigér udtryk og resultat</strong>, fx h_top + h_midte + h_bund. Vælg derefter en størrelse og kilde for hvert symbol. Du kan bruge figurmål, kendte værdier og andre formler.</p><p>Til en ukendt midterhøjde bruges først <strong>Isolér et mål</strong> med et kendt totalrumfang. <strong>Tilføj samlet højde</strong> opretter summen med en reference til den fundne højde. Diameter og keglehøjder alene bestemmer ikke midterhøjden.</p>'},
    {section:'REFERENCER', title:'Tilpas hver del af formlen', target:'#inspector .formula-args > .input-group:nth-child(2)', scene:'known', body:'<p>Menuen ved hver størrelse giver dig tre muligheder: <strong>Kendt størrelse</strong>, <strong>Indsæt en formel</strong> eller <strong>Brug en reference</strong>.</p><p>Her er Qᵥ en kendt størrelse: du har allerede flowet fra opgaven. Hvis du i stedet kender areal og hastighed, kan du vælge formlen Qᵥ = A · v. Menuen viser kilder med den rigtige størrelse.</p>'},
    {section:'REFERENCER', title:'En reference følger sin kilde', target:'#inspector .formula-args > .input-group:nth-child(2)', body:'<p>Nu henter Qᵥ sin formel fra <strong>Volumenflow</strong> i Mine formler. Ændrer du kilden, følger fyldetiden automatisk med. <strong>Tilpas kilde</strong> åbner kildens indstillinger.</p><p>Volumenflowets A henviser videre til rørets tværsnit. På samme måde henter V bassindelenes samlede rumfang. Du kan altså bygge en kæde af referencer.</p>'},
    {section:'REFERENCER', title:'Indsæt en formel direkte', target:'#inspector .formula-args > .input-group:nth-child(2)', scene:'inline', body:'<p>Ved en reference vælger du <strong>Indsæt formlen her</strong>, hvis du vil have en kopi, som kan tilpasses på stedet. Her er Qᵥ = A · v nu indsat direkte under fyldetiden.</p><p>Kopien følger ikke længere selve Volumenflow-formlen. Dens underreferencer, fx A fra røret, følger stadig deres egne kilder. Du kan også vælge en formel direkte i dropdownen.</p>'},
    {section:'RESULTAT', title:'Se den færdige formel', target:'#formula-preview', body:'<p><strong>Kort</strong> viser referencer som symboler. <strong>Udfoldet</strong> sætter delformlerne ind i hinanden, som vist her. Unødige parenteser fjernes automatisk. Nødvendige parenteser bevares fx omkring en sum, der skal ganges, en samlet nævner i kopieret tekst eller et udtryk under en potens.</p><p><strong>Kopiér formel</strong> tager den viste formel og de valgte enheder med. Du kan indsætte opgavens tal under <strong>Størrelserne i formlen</strong> og derefter regne udtrykket på din egen lommeregner.</p>'},
    {section:'OMSKRIVNING', title:'Find en anden størrelse', target:'.rearrange-control', body:'<p>Med <strong>Isolér en størrelse</strong> kan du vende grundformlen. Fra <strong>t = V / Qᵥ</strong> kan du fx vælge V eller Qᵥ. Ved <strong>v = π · D · n</strong> kan du vælge n og få <strong>n = v / (π · D)</strong>.</p><p>Omskrivningen ændrer den valgte formel på samme plads i listen og i samme gruppe. Den tidligere venstreside bliver et kendt input. Andre formler, der henviste til den, følger nu dette input, så de fortsat bruger den samme størrelse. Kontrollér enheder og forudsætninger; enkelte ligninger har to rødder.</p>'},
    {section:'RESULTAT', title:'Følg formlen hele vejen tilbage', target:'.chain-details', detail:'chain-time', body:'<p>Åbn <strong>Se formelkæden</strong> for at følge delformlerne bag resultatet: fra rørets tværsnit til volumenflow og videre til fyldetid.</p><p><strong>Tilpas</strong> ved et led åbner dets indstillinger. Det gør det nemt at finde det sted, hvor en størrelse eller reference skal ændres.</p>'},
    {section:'ENHEDER', title:'Vælg præcis de enheder, du har', target:'.unit-symbol-list > div:last-child', scene:'units', body:'<p>Under <strong>Størrelserne i formlen</strong> vælger du opgavens enhed for hvert symbol. Med tal i feltet bliver <strong>20 mm → 0,02 m</strong> omregnet, før tallet vises i formlen. Feltet beholder 20 mm. Tomme felter viser symbolet og den nødvendige omregning.</p><p>For brøkenheder vælger du <strong>tæller og nævner hver for sig</strong>, som L/min her. Det virker også for fx t/m³ og kg/h i de relevante formler. Fælles enhedsfaktorer forkortes automatisk, fx ÷60 og ×60 ved omdr./min til m/min. Følg den viste formel uden ekstra omregning.</p>'},
    {section:'TAL', title:'Skriv de tal, du har fra opgaven', target:'.unit-symbol-list', scene:'numbers', body:'<p>Feltet <strong>Tal (valgfrit)</strong> indsætter tallet direkte i formlen. Her er B = 50 og L = 30 med meter som enhed. Du kan bruge komma eller punktum, fx 2,5.</p><p>Et tomt felt beholder symbolet. <strong>Ryd</strong> fjerner tallet igen. Hver selvstændig formel og figur har egne tal og enheder. Indsatte underformler deler værdier inden for samme formel; referencer følger deres kilde. Skifter du enhed, beholdes det tal, du har skrevet.</p>'},
    {section:'TAL', title:'Små mærker forklarer hvert tal', target:'#formula-preview', scene:'numbers', body:'<p>Efter 50 står <strong>m (B)</strong> med småt, og efter 30 står <strong>m (L)</strong>. Du kan dermed se både enheden og det oprindelige symbol. Mærkerne er forklaringer og skal ikke tastes på lommeregneren.</p><p>Standardvisningen viser udtrykket til indtastning på din lommeregner. Omregninger og nødvendige parenteser er med, også omkring negative tal. TI-30-længdeskønnet bruger dine tal og udelader de små mærker.</p>'},
    {section:'TAL', title:'Skift mellem værdier og enheder', target:'.value-display-control', scene:'numbers', valueDisplay:'values', body:'<p>Den tredelte knap <strong>Værdier · Enheder · Begge</strong> bestemmer, hvordan inputtene vises. Værdier giver fx <strong>30 · 50</strong>; Enheder giver <strong>L · B</strong>; Begge viser tallene med de små mærker.</p><p>Dine tal og enhedsvalg bevares. Visningen gælder også formelkæden, delberegninger og kopiering. Faste tal og nødvendige omregninger for ubekendte og resultatet vises fortsat. TI-30-skønnet bruger altid dine indtastede tal. Browseren husker valget.</p>'},
    {section:'ENHEDER', title:'Vælg enheden for svaret', target:'.result-unit-row', scene:'units', body:'<p><strong>Resultatets enhed</strong> bestemmer, hvordan det samlede udtryk skal omregnes. Her er fyldetiden valgt i <strong>minutter</strong>. Andre formler tilbyder fx liter, ton og kW.</p><p>Inputenheder følger symbolet i den formel eller figur, det tilhører. Referencer følger deres kilde. Hver formel har sin egen resultatenhed. Dine enhedsvalg kommer med, når du gemmer eller kopierer.</p>'},
    {section:'GEM OG FORTSÆT', title:'Klar til din egen opgave', target:'.top-actions', body:'<p><strong>Gem opsætning</strong> henter en fil med dine figurer, formler, indtastede tal og enhedsvalg. Brug <strong>Åbn opsætning</strong> til at hente den ind igen, også på en anden computer. Sol/måne-knappen skifter mellem lyst og mørkt tema.</p><p>Hele kompendiet og denne guide virker offline. Tryk <strong>Afslut introduktion</strong> for at vende tilbage til din egen opsætning. <strong>?</strong> starter guiden igen.</p>'}
  ];
  function prepareTutorialStep(step) {
    if ($('#app-dialog').open) closeDialog();
    model = E.example();
    if(step.scene==='organize'){
      model=E.addFormulaGroup(model,'tank-group','Tank og flow');model=E.addFormulaGroup(model,'answer-group','Fyldetid');
      for(const id of ['volume','flow'])model=E.assignFormulaGroup(model,id,'tank-group');model=E.assignFormulaGroup(model,'time','answer-group');
    }
    valueDrafts = new Map();
    valueDisplay = step.valueDisplay||'both';
    resultVisible = false;entryKeys = [];
    model.title = 'Introduktion · bassin med keglebund';
    model.shapes.find(s=>s.id==='cylinder').faces.top = 'open';
    if (['parts','join'].includes(step.scene)) model.connections = [];
    if (['known','units'].includes(step.scene)) model.formulas.find(f=>f.id==='time').expression.args.Q = E.symbol('Q_v');
    if (step.scene === 'inline') model.formulas.find(f=>f.id==='time').expression.args.Q = E.clone(model.formulas.find(f=>f.id==='flow').expression);
    if (step.scene === 'units') {
      model.inputUnits = {'shape:cylinder:D_1:length':'mm','formula:time:Q_v:flow':'L_min'};
      model.formulas.find(f=>f.id==='time').resultUnit = 'min';
    }
    activeId = 'time';
    if(step.scene==='numbers'){
      model={version:6,inputUnits:{'formula:area:B:length':'m','formula:area:L:length':'m'},inputValues:{'formula:area:B:length':'50','formula:area:L:length':'30'},title:'Introduktion · tal i formlen',tank:E.defaultTank(),shapes:[],connections:[],formulas:[E.newFormula('area','rectangleArea')]};
      activeId='area';
    }
    if(step.scene==='custom'){
      const f=E.newCustomFormula('own');f.expression=E.customExpression('h_cylinder + h_kegle','length',{h_cylinder:{dimension:'length',expression:E.ref('shape:cylinder:input:h')},h_kegle:{dimension:'length',expression:E.ref('shape:cone:input:h')}});model.formulas.push(f);activeId='own';
    }
    E.initializeUnitChoices(model);
    selected = step.focus ? {type:'shape',id:step.focus} : {type:'formula',id:activeId};
    expanded = true; geometryView = '3d'; libraryQuery = step.scene === 'library' ? 'Pvirk' : '';
    changeView(step.scene === 'library' ? 'library' : 'builder');
    render();
    for (const detail of document.querySelectorAll('details[data-detail-key]')) detail.open = detail.dataset.detailKey === step.detail;
    $('#inspector').scrollTop = 0;
    $('#save-status').textContent = 'Introduktion · midlertidigt eksempel';
    if (step.scene === 'join') {
      openJoin('cylinder','bottom');
      joinDraft.target = 'existing:cone:base';
      $('#app-dialog').querySelector('.dialog-body').innerHTML = joinFields();
    }
    const selectors = Array.isArray(step.target) ? step.target : [step.target];
    return () => selectors.map(selector=>document.querySelector(selector)).find(element=>element?.getClientRects().length) || $('.help-button');
  }
  function finishTutorial() {
    const previous = tutorial;
    if (!previous) return;
    if ($('#app-dialog').open) closeDialog();
    if (preview3D) {preview3D.destroy(); preview3D=null;}
    tutorial = null;
    ({model,activeId,selected,expanded,geometryView,previewPose,libraryQuery,valueDrafts,valueDisplay,resultVisible} = previous);
    changeView(previous.view); render();
    for (const detail of document.querySelectorAll('details[data-detail-key]')) detail.open = previous.details.includes(detail.dataset.detailKey);
    $('#save-status').textContent = previous.saveStatus;
    $('#inspector').scrollTop = previous.inspectorTop;
    $('#inspector').scrollLeft = previous.inspectorLeft;
    window.scrollTo({left:previous.scrollX,top:previous.scrollY,behavior:'instant'});
    (previous.origin?.isConnected ? previous.origin : $('.help-button')).focus({preventScroll:true});
  }
  function startTutorial() {
    if (tutorial) return;
    tutorial = {model,activeId,selected,view,expanded,geometryView,previewPose:preview3D?.getPose()||previewPose,libraryQuery,valueDrafts,valueDisplay,resultVisible,
      origin:document.activeElement,scrollX:window.scrollX,scrollY:window.scrollY,
      inspectorTop:$('#inspector').scrollTop,inspectorLeft:$('#inspector').scrollLeft,
      saveStatus:$('#save-status').textContent,
      details:[...document.querySelectorAll('details[open][data-detail-key]')].map(d=>d.dataset.detailKey)};
    clearTimeout(toastTimer); $('#toast').hidden = true;
    try { window.PPTour.start({steps:tutorialSteps,prepare:prepareTutorialStep,finish:finishTutorial,help:showHelp}); }
    catch (_) { finishTutorial(); notify('Introduktionen kunne ikke åbnes. Din opsætning er bevaret.'); }
  }
  document.addEventListener('click',event=>{
    if (tutorial) return;
    const tab=event.target.closest('[data-view]');if(tab){changeView(tab.dataset.view);return;}
    const b=event.target.closest('[data-action]');if(!b)return;
    const a=b.dataset.action;
    if(a==='theme'){theme=theme==='dark'?'light':'dark';setTheme();try{localStorage.setItem(THEME,theme);}catch(_){}}
    else if(a==='hide-result'){resultVisible=false;entryKeys=[];render();}
    else if(a==='clear-value'){
      valueDrafts.delete(b.dataset.id);if(model.inputValues)delete model.inputValues[b.dataset.id];
      save();render();
      [...document.querySelectorAll('[data-action="input-value"]')].find(el=>el.dataset.id===b.dataset.id)?.focus({preventScroll:true});
    }
    else if(a==='move-formula'||a==='move-formula-group'){
      try{model=(a==='move-formula'?E.moveFormula:E.moveFormulaGroup)(model,b.dataset.id,b.dataset.part==='up'?-1:1);refreshOrganization(a,b.dataset.id,b.dataset.part);}catch(error){notify(error.message);}
    }
    else if(a==='new-formula-group')formulaGroupDialog();
    else if(a==='edit-formula-group')formulaGroupDialog(b.dataset.id);
    else if(a==='toggle-formula-group'){
      const group=model.formulaGroups?.find(g=>g.id===b.dataset.id);if(group){group.collapsed=!group.collapsed;refreshOrganization(a,group.id);}
    }
    else if(a==='save-formula-group'){
      const input=$('#app-dialog').querySelector('[data-group-name]');if(!input.reportValidity())return;
      try{
        const id=b.dataset.id||newId('group');let next=b.dataset.id?E.renameFormulaGroup(model,id,input.value):E.addFormulaGroup(model,id,input.value);
        if(b.dataset.formula)next=E.assignFormulaGroup(next,b.dataset.formula,id);
        model=next;closeDialog();refreshOrganization('toggle-formula-group',id);notify('Gruppen er gemt.');
      }catch(error){notify(error.message);}
    }
    else if(a==='remove-formula-group'){
      try{model=E.removeFormulaGroup(model,b.dataset.id);closeDialog();save();render();document.querySelector('[data-action="new-formula-group"]').focus();notify('Gruppen er fjernet. Formlerne ligger under Uden gruppe.');}catch(error){notify(error.message);}
    }
    else if(a==='select-formula')select('formula',b.dataset.id,true);
    else if(a==='select-shape')select('shape',b.dataset.id,true);
    else if(a==='add-shape')addShape(b.dataset.type);
    else if(a==='geometry-view'){geometryView=b.dataset.mode;render(true);}
    else if(a==='zoom-in')preview3D?.zoom(1.2);
    else if(a==='zoom-out')preview3D?.zoom(1/1.2);
    else if(a==='reset-camera')preview3D?.reset();
    else if(a==='join')openJoin(b.dataset.id,b.dataset.face);
    else if(a==='confirm-join')commitJoin();
    else if(a==='disconnect'){model=E.disconnect(model,b.dataset.id);save();render();notify('Figurerne er skilt ad. Frie ender og egne mål er gendannet.');}
    else if(a==='use-assembly')useAssembly(b.dataset.dimension,b.dataset.shape);
    else if(a==='edit-custom')customFormulaDialog(JSON.parse(b.dataset.path),b.dataset.dimension);
    else if(a==='save-custom')saveCustomFormula(JSON.parse(b.dataset.path),b.dataset.dimension);
    else if(a==='total-height'){
      try{const id=newId('formula');model=E.totalHeightFromMeasure(model,b.dataset.id,id);save();select('formula',id);notify('Samlet højde er tilføjet med referencer til delene.');}catch(error){notify(error.message);}
    }
    else if(a==='edit-tank')select('tank','tank',true);
    else if(a==='inspect-face'){
      select('shape',b.dataset.id,true);
      const row=[...document.querySelectorAll('[data-face-row]')].find(el=>el.dataset.faceRow===b.dataset.face);
      row?.querySelector('select,button')?.focus({preventScroll:true});
    }
    else if(a==='add-formula')formulaPicker(b.dataset.group);
    else if(a==='use-formula'){if($('#app-dialog').open)closeDialog();addFormula(b.dataset.formula,b.dataset.group);}
    else if(a==='expansion'){expanded=b.dataset.expanded==='true';render(true);}
    else if(a==='value-display'&&Object.hasOwn(VALUE_DISPLAYS,b.dataset.id)){
      valueDisplay=b.dataset.id;
      try{localStorage.setItem(DISPLAY,valueDisplay);}catch(_){/* Storage is optional. */}
      render(true);
    }
    else if(a==='back-to-formula'){if(activeId)select('formula',activeId,true);}
    else if(a==='inspect-reference')inspectReference(b.dataset.target);
    else if(a==='inline'){
      const path=JSON.parse(b.dataset.path),ctx=E.context(model),plate=path[0]==='shapes'&&path[2]==='plateThickness'&&path.length===4,expr=getAt(path)||(plate?E.plateThickness(model.shapes[path[1]],path[3]):null),d=ctx.map.get(expr?.target);
      if(d){
        const before=E.clone(model);
        try{
          if(plate)model=E.setPlateThickness(model,model.shapes[path[1]].id,path[3],d.expression);else setAt(path,E.clone(d.expression));
          E.copyInputs(model,E.inputScope(d),E.inputScope(ctx.map.get(ownerTarget(path))));E.validateModel(model);save();render();notify('Formlen er indsat som en kopi. Dens underreferencer er bevaret.');}
        catch(_){model=before;notify('Formlen bliver for dyb. Behold referencen.');}
      }
    }
    else if(a==='delete')remove(b.dataset.type,b.dataset.id);
    else if(a==='export')exportSetup();
    else if(a==='import')$('#file-input').click();
    else if(a==='copy-formula')void copyFormula();
    else if(a==='new')replaceSetup({version:6,inputUnits:{},title:'Ny opsætning',tank:E.defaultTank(),shapes:[],formulas:[],connections:[]},'Start en tom opsætning?');
    else if(a==='example')replaceSetup(E.example(),'Indlæs bassin-eksemplet?');
    else if(a==='tutorial')startTutorial();
    else if(a==='close-dialog')closeDialog();
    else if(a==='confirm'){const action=pending;closeDialog();if(action)action();}
    else if(a==='help')showHelp();
  });
  document.addEventListener('change',event=>{
    if (tutorial) return;
    const el=event.target,a=el.dataset.action;
    if(a==='join-host'||a==='join-face'||a==='join-target'){
      if(!joinDraft)return;
      joinDraft[a==='join-host'?'host':a==='join-face'?'face':'target']=el.value;
      if(a!=='join-target'){
        $('#app-dialog').querySelector('.dialog-body').innerHTML=joinFields();
        [...$('#app-dialog').querySelectorAll('[data-action]')].find(e=>e.dataset.action===a)?.focus();
      }
      return;
    }
    if(el.id==='goal-select'){
      if(el.value.startsWith('saved:'))select('formula',el.value.slice(6));
      else if(el.value.startsWith('new:'))addFormula(el.value.slice(4));return;
    }
    if(a==='formula-group'){
      if(el.value==='+new'){formulaGroupDialog('',el.dataset.id);el.value=model.formulas.find(f=>f.id===el.dataset.id)?.groupId||'';return;}
      try{model=E.assignFormulaGroup(model,el.dataset.id,el.value);refreshOrganization(a,el.dataset.id);}catch(error){render(true);notify(error.message);}return;
    }
    if(a==='input-unit'||a==='input-unit-part'){
      const key=el.dataset.id,variable={symbol:el.dataset.symbol,dimension:el.dataset.dimension,scope:key.split(':').slice(0,-2).join(':')};
      const unit=a==='input-unit-part'?E.Units.withPart(variable.dimension,E.inputUnit(model,variable).id,el.dataset.part,el.value):E.Units.get(variable.dimension,el.value);
      model.inputUnits||={};
      model.inputUnits[key]=unit.id;
      expanded=true;save();render(true);
    }else if(a==='result-unit'||a==='result-unit-part'){
      const f=model.formulas.find(f=>f.id===el.dataset.id);
      if(f){f.resultUnit=(a==='result-unit-part'?E.Units.withPart(f.dimension,E.resultUnit(f).id,el.dataset.part,el.value):E.Units.get(f.dimension,el.value)).id;expanded=true;save();render(true);}
    }else if(a==='isolate-figure-formula'){
      if(!el.value)return;
      try{const id=el.dataset.id;model=E.isolateFigureFormula(model,id,el.value);expanded=true;save();select('formula',id);notify('Målet er isoleret. Angiv det kendte samlede rumfang eller areal.');}
      catch(error){render(true);notify(error.message);}
    }else if(a==='measure-unknown'||a==='measure-dimension'||a==='assembly-scope'){
      const path=JSON.parse(el.dataset.path),expr=getAt(path);
      if(a==='assembly-scope'&&expr?.kind==='assembly'){
        if(el.value)expr.shapeId=el.value;else delete expr.shapeId;
        const parent=getAt(path.slice(0,-1));if(parent?.kind==='isolatedMeasure'&&path.at(-1)==='source')parent.unknown='';
      }else if(expr?.kind==='isolatedMeasure'){
        if(a==='measure-dimension'){
          expr.sourceDimension=el.value;expr.source=E.assembly(el.value,undefined,expr.source.shapeId);expr.given=E.symbol(el.value==='area'?'A_total':'V_total');expr.unknown='';
        }else{
          const choice=E.figureMeasureOptions(model,expr.source,expr.sourceDimension,ownerTarget(path)).options.find(o=>o.key===el.value);
          if(el.value&&!choice?.available){notify(choice?.reason||'Vælg et mål i figuren.');return;}
          expr.unknown=el.value;
          if(path.length===3&&path[0]==='formulas'&&choice){const f=model.formulas[path[1]];f.symbol=choice.symbol;f.resultUnit=choice.unit;f.name=('Samlet figur → '+choice.label).slice(0,120);}
        }
      }
      expanded=true;save();render(true);
    }else if(a==='rearrange-formula'){
      if(!el.value)return;
      try{
        const id=el.dataset.id;model=E.rearrangeFormula(model,id,el.value);
        expanded=true;save();select('formula',id);notify('Formlen er omskrevet. Vælg de kendte størrelser og deres enheder.');
      }catch(error){render(true);notify(error.message);}
    }else if(a==='custom-dimension'){
      const path=JSON.parse(el.dataset.path),old=getAt(path);
      try{setAt(path,{dimension:el.value,expression:E.symbol(el.dataset.symbol)});E.validateModel(model);save();render(true);}catch(error){setAt(path,old);render(true);notify(error.message);}
    }else if(a==='source'){
      const path=JSON.parse(el.dataset.path),old=getAt(path);
      const next=el.value==='custom'?E.customExpression('a + b',el.dataset.dimension):el.value.startsWith('assembly:')?E.assembly(el.dataset.dimension,undefined,el.value.slice(9)):el.value.startsWith('material:')?E.assembly('volume','materialVolume',el.value.slice(9)):el.value==='isolatedMeasure'?E.newFigureMeasure(model,'temporary').expression:el.value==='fillHeight'?E.fillHeight(E.components(model).length===1?model.shapes[0]?.id||'':''):el.value==='symbol'?E.symbol(el.dataset.symbol):el.value==='zero'?{kind:'zero',dimension:el.dataset.dimension}:el.value==='material'?E.assembly('volume','materialVolume'):el.value==='assembly'?E.assembly(el.dataset.dimension):el.value.startsWith('formula:')?E.newExpression(el.value.slice(8)):E.ref(el.value.slice(4));
      if(path[0]==='shapes'&&path[2]==='plateThickness'&&path.length===4){
        try{model=E.setPlateThickness(model,model.shapes[path[1]].id,path[3],next);save();render(true);}catch(error){render(true);notify(error.message);}return;
      }
      setAt(path,next);try{E.validateModel(model);save();render(true);}catch(_){setAt(path,old);render(true);notify('Formlen bliver for dyb. Tilføj en separat formel og brug en reference.');}
    }else if(a==='fill-tank'||a==='fill-orientation'){
      const expr=getAt(JSON.parse(el.dataset.path));
      if(expr?.kind==='fillHeight'){
        if(a==='fill-tank')expr.shapeId=el.value;else expr.inverted=el.value==='inverted';
        save();render(true);
      }
    }else if(a==='diameter-basis'){
      try{model=E.setDiameterBasis(model,el.dataset.id,el.value);save();render(true);}catch(error){render(true);notify(error.message);}
    }else if(a==='include'){E.setIncluded(model,el.dataset.id,el.checked);save();render(true);}
    else if(a==='face-state'){
      const shape=model.shapes.find(s=>s.id===el.dataset.id);
      if(shape&&!E.connectionAt(model,shape.id,el.dataset.face)){shape.faces[el.dataset.face]=el.value;save();render(true);}
    }
  });
  document.addEventListener('input',event=>{
    if (tutorial) return;
    const el=event.target;
    if(el.dataset.action==='search-formulas'){libraryQuery=el.value;renderLibraryResults();return;}
    if(el.dataset.action==='input-value'){
      const key=el.dataset.id,value=E.parseInputValue(el.value);
      valueDrafts.set(key,el.value);model.inputValues||={};
      if(value===null||value==='')delete model.inputValues[key];else model.inputValues[key]=value;
      expanded=true;save();render(true);return;
    }
    if(el.id==='project-title'){model.title=el.value.trim()||'Ny opsætning';save();}
    else if(el.dataset.action==='rename'){
      const list=el.dataset.type==='shape'?model.shapes:model.formulas,item=list.find(o=>o.id===el.dataset.id);
      if(el.value.trim()){item.name=el.value;save();render(true);}
    }
  });
  document.addEventListener('keydown',event=>{
    if(tutorial||event.key!=='Enter'||event.isComposing||!event.target.matches?.('[data-group-name]'))return;
    event.preventDefault();$('#app-dialog').querySelector('[data-action="save-formula-group"]').click();
  });
  $('#file-input').addEventListener('change',async event=>{
    const file=event.target.files[0];event.target.value='';if(!file)return;
    if(file.size>1000000){notify('Filen er for stor. Maksimum er 1 MB.');return;}
    try{const candidate=E.initializeUnitChoices(E.validateModel(JSON.parse(await file.text())),false);replaceSetup(candidate,'Åbn '+candidate.title+'?');}
    catch(error){openDialog('Opsætningen kunne ikke åbnes',`<p>${esc(error instanceof SyntaxError?'Filen er ikke gyldig JSON. Vælg en fil gemt fra kompendiet.':error.message)}</p>`);}
  });
  $('#app-dialog').addEventListener('cancel',()=>{pending=null;joinDraft=null;});
  document.addEventListener('keydown',event=>{
    if(['Enter',' '].includes(event.key)&&event.target.matches('svg [role="button"]')){
      event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));
    }
  });
  document.addEventListener('keydown',event=>{
    if(tutorial||$('#app-dialog').open||event.isComposing||event.altKey||event.ctrlKey||event.metaKey||event.target.isContentEditable||event.target.closest?.('input,textarea,select')){entryKeys=[];return;}
    if(event.repeat)return;
    const sequence=['arrowup','arrowup','arrowdown','arrowdown','arrowleft','arrowright','arrowleft','arrowright','b','a','enter'];
    entryKeys.push(event.key.toLowerCase());if(entryKeys.length>sequence.length)entryKeys.shift();
    if(entryKeys.length===sequence.length&&sequence.every((key,i)=>key===entryKeys[i])){
      event.preventDefault();event.stopPropagation();entryKeys=[];resultVisible=!resultVisible;
      changeView('builder');render();
      document.querySelector('.result-panel')?.scrollIntoView({block:'nearest',behavior:'instant'});
    }
  },true);
  $('#app-dialog').addEventListener('click',event=>{if(event.target===$('#app-dialog')){const r=event.target.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeDialog();}});
  $('.brand').addEventListener('click',event=>{event.preventDefault();changeView('builder');});
  $('.view-tabs').addEventListener('keydown',event=>{
    if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();
    const tabs=[...document.querySelectorAll('[data-view]')],i=tabs.indexOf(document.activeElement),n=event.key==='Home'?0:event.key==='End'?tabs.length-1:(i+1)%tabs.length;
    changeView(tabs[n].dataset.view);tabs[n].focus();
  });
  setTheme();render();if(notice)notify(notice);
  // Deliberately no network requests or AI integration.
})();

</script>
</body>
</html>
