      else show(index+1);
    });
    dialog.addEventListener('cancel', event => { event.preventDefault(); end(); });
    dialog.addEventListener('close', () => end());
    dialog.addEventListener('keydown', event => {
      if (event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.key === 'ArrowLeft') { event.preventDefault(); show(index-1); }
      else if (event.key === 'ArrowRight') { event.preventDefault(); if(index < steps.length-1) show(index+1); }
      else if ((event.key === 'Enter' || event.key === ' ') && event.target === find('#tour-title')) {
        event.preventDefault(); if(index === steps.length-1) end(); else show(index+1);
      }
    });
    document.addEventListener('scroll', schedule, true);
    window.addEventListener('resize', reveal);
    window.visualViewport?.addEventListener('resize', reveal);
    try { show(0); } catch (error) { end(); throw error; }
    return {close:() => end()};
  }
  return {start, placement};
});

</script>
<script>
/* app.js */
(function () {
  'use strict';
  const E = window.PP;
  const STORAGE = 'pp-kompendium.symbolic.v2', THEME = 'pp-kompendium.theme';
  const $ = selector => document.querySelector(selector);

  const pathAttr = p => esc(JSON.stringify(p));
  let model = E.example(), activeId = 'time', selected = { type:'formula', id:'time' };
  let view = 'builder', expanded = true, uid = 0, toastTimer, pending = null, dialogOrigin = null, notice = '', joinDraft = null;

  } catch (_) { notice = 'Den gemte opsætning kunne ikke åbnes. Bassin-eksemplet er indlæst.'; }

  try { theme = localStorage.getItem(THEME) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (_) { /* Storage is optional. */ }
  if (!['light','dark'].includes(theme)) theme = 'light';
  const icons = {
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',
    moon:'<path d="M20 14.2A8.4 8.4 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2Z"/>',
    close:'<path d="m6 6 12 12M6 18 18 6"/>',
    copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>',
    trash:'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/>'
  };
  const icon = name => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name] || ''}</svg>`;
  function shapeIcon(type) {
    const drawings = {
      cylinder:'<ellipse cx="25" cy="10" rx="16" ry="6"/><path d="M9 10v26c0 8 32 8 32 0V10"/><path d="M9 35c0-8 32-8 32 0" stroke-dasharray="3 3"/>',
      cone:'<ellipse cx="25" cy="10" rx="18" ry="6"/><path d="m7 10 18 33 18-33"/>',
      frustum:'<ellipse cx="25" cy="10" rx="18" ry="6"/><path d="m7 10 8 28c2 5 18 5 20 0l8-28"/><path d="M15 38c2-5 18-5 20 0" stroke-dasharray="3 3"/>',
      box:'<path d="m7 15 27-9 12 10-27 9-12-10Zm0 0v22l12 10 27-9V16M19 25v22"/><path d="M34 6v22L7 37m27-9 12 10" stroke-dasharray="3 3"/>',
      sphere:'<circle cx="25" cy="25" r="19"/><ellipse cx="25" cy="25" rx="19" ry="7"/><ellipse cx="25" cy="25" rx="8" ry="19" stroke-dasharray="3 3"/>',
      hemisphere:'<path d="M6 31a19 19 0 0 1 38 0"/><ellipse cx="25" cy="31" rx="19" ry="7"/>',
      pipe:'<ellipse cx="11" cy="28" rx="7" ry="14"/><path d="m11 14 27-8c10 0 10 28 0 28l-27 8"/><path d="M38 6c-10 0-10 28 0 28" stroke-dasharray="3 3"/>'
    };
    return `<svg viewBox="0 0 52 52" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linejoin="round" aria-hidden="true">${drawings[type]}</svg>`;
  }
  const symbolHtml = s => `<math xmlns="http://www.w3.org/1998/Math/MathML">${E.mathSymbol(s)}</math>`;
  const pretty = s => s.replace(/_/g, '');
  const schoolRef = f => f?.source ? [...f.source.triangles,'s. '+f.source.pages.join(', ')].join(' · ') : '';
  const formulaTitle = f => f.name+(f.source?.triangles.length?' · '+f.source.triangles.join('/'):'');
  let libraryQuery='';
  const active = () => model.formulas.find(f => f.id === activeId);
  const getAt = p => p.reduce((o,k) => o[k], model);
  function setAt(p,v) { getAt(p.slice(0,-1))[p.at(-1)] = v; }
  const newId = prefix => prefix + '-' + Date.now().toString(36) + '-' + (++uid);
  function ownerTarget(path) { if(path[0]==='tank')return 'tank:thickness';if(path[0]==='shapes')return path[2]==='diameter'?`shape:${model.shapes[path[1]].id}:diameterThickness`:`shape:${model.shapes[path[1]].id}:input:${path[3]}`;return `formula:${model.formulas[path[1]].id}`; }
  function notify(message) {
    clearTimeout(toastTimer); $('#toast').textContent = message; $('#toast').hidden = false;
    toastTimer = setTimeout(() => { $('#toast').hidden = true; }, 4500);
  }
  function save() {
    if (tutorial) return;
    try { localStorage.setItem(STORAGE,JSON.stringify(model)); $('#save-status').textContent = 'Gemt på denne computer'; }
    catch (_) { $('#save-status').textContent = 'Gem opsætningen som fil'; }
  }
  function setTheme() {
    document.documentElement.dataset.theme = theme;
    $('#theme-toggle').innerHTML = icon(theme === 'dark' ? 'sun' : 'moon');
    const title = `Skift til ${theme === 'dark' ? 'lyst' : 'mørkt'} tema`;
    $('#theme-toggle').setAttribute('aria-label',title); $('#theme-toggle').title = title;
    preview3D?.redraw();
  }
  function formulaSummary(expression, dimension, ctx, lhs) {
    try { return E.math(ctx.expand(expression,dimension,'compact'),lhs,E.Units.base(dimension).label); }
    catch (error) { return `<p class="inline-error">${esc(error.message)}</p>`; }
  }
  function renderSidebar() {
    $('#library-total').textContent=Object.keys(E.FORMULAS).length;
    $('#shape-library').innerHTML = Object.entries(E.SHAPES).map(([type,s]) => `<button class="shape-tool" data-action="add-shape" data-type="${type}" aria-label="Indsæt ${esc(s.name.toLowerCase())}" title="${esc(s.hint)}">${shapeIcon(type)}<span>${esc(s.name)}</span></button>`).join('');
    $('#formula-count').textContent = model.formulas.length;
    $('#saved-formulas').innerHTML = model.formulas.map(f => `<button class="saved-formula ${f.id === activeId ? 'active' : ''}" data-action="select-formula" data-id="${esc(f.id)}" ${f.id === activeId ? 'aria-current="true"' : ''}><span class="saved-symbol">${symbolHtml(f.symbol)}</span><span>${esc(f.name)}</span><span class="item-chevron" aria-hidden="true">›</span></button>`).join('');
  }
  function renderGoal() {
    $('#goal-select').innerHTML = (model.formulas.length ? '<optgroup label="Mine formler">' + model.formulas.map(f => `<option value="saved:${esc(f.id)}" ${f.id === activeId ? 'selected' : ''}>${esc(formulaTitle(f))} · ${esc(pretty(f.symbol))}</option>`).join('') + '</optgroup>' : '<option value="" selected>Vælg en formel…</option>') + '<optgroup label="Tilføj en ny formel">' + Object.entries(E.FORMULAS).map(([id,f]) => `<option value="new:${id}">${esc(formulaTitle(f))} · ${esc(pretty(f.symbol))}</option>`).join('') + '</optgroup>';
  }
  function renderFigures(ctx) {
    if(preview3D){previewPose=preview3D.getPose();preview3D.destroy();preview3D=null;}
    $('#shape-count').textContent = `${model.shapes.length} ${model.shapes.length === 1 ? 'figur' : 'figurer'}`;
    $('#figure-tray').innerHTML = model.shapes.length ? model.shapes.map(s => {
      const joined = (model.connections||[]).some(c=>c.a.shape===s.id||c.b.shape===s.id);
      return `<div class="figure-card"><button class="figure-tile ${selected?.type === 'shape' && selected.id === s.id ? 'selected' : ''}" data-action="select-shape" data-id="${esc(s.id)}" aria-pressed="${selected?.type === 'shape' && selected.id === s.id}"><span class="figure-number">${String(s.ordinal).padStart(2,'0')}</span><div class="figure-icon">${shapeIcon(s.type)}</div><span class="figure-name">${esc(s.name)}</span><span class="figure-role">${joined?'Sammenføjet':s.include?'Beholderdel':'Separat figur'}</span></button><button class="figure-remove" data-action="delete" data-type="shape" data-id="${esc(s.id)}" aria-label="Fjern ${esc(s.name)}" title="Fjern ${esc(s.name)}">${icon('trash')}<span>Fjern</span></button></div>`;
    }).join('') : '<div class="empty-figures">Indsæt en figur fra værktøjskassen, hvis din formel skal bruge et areal eller et rumfang.</div>';
    const included = model.shapes.filter(s => s.include);
    $('#construction-note').textContent = included.length ? 'Vælg en figur for at angive indre/ydre diameter og åbne/lukkede ender. Brug Sammensæt til at sætte en anden figur på en ende.' : 'Du kan også bruge formlerne uden figurer. Behold de størrelser, du allerede kender, som symboler.';
    const groups=E.components(model).filter(ids=>ids.length>1);
    const joints=model.connections||[];
    const summaries=['volume','area'].map(dimension=>{
      try{return `<div class="assembly-formula"><div><span>${dimension==='volume'?'Samlet rumfang':'Samlet pladeareal'}</span><button class="text-button" data-action="use-assembly" data-dimension="${dimension}">Brug formel</button></div><div class="assembly-equation">${E.math(ctx.expand(E.assembly(dimension),dimension),dimension==='volume'?'V_samlet':'A_plade',E.Units.base(dimension).label)}</div></div>`;}catch(error){return `<p class="inline-error">${esc(error.message)}</p>`;}
    }).join('');
    const viewer=geometryView==='3d'?'<div class="solid-viewer"><canvas class="model-viewer-canvas" tabindex="0" role="img" aria-label="Interaktiv 3D-visning af dine figurer. Træk eller brug piletasterne for at dreje. Brug plus og minus for zoom.">Din browser kan ikke vise 3D-forhåndsvisningen. Vælg Skitse.</canvas><div class="viewer-controls"><button class="icon-button" data-action="zoom-out" aria-label="Zoom ud">−</button><button class="icon-button" data-action="zoom-in" aria-label="Zoom ind">+</button><button class="text-button" data-action="reset-camera">Nulstil vinkel</button></div><p>Træk for at dreje · scroll for zoom</p></div>':`<div class="compound-grid">${E.components(model).map(ids=>`<div class="compound-wrap">${window.PPGeometry.render(model,ids,selected?.type==='shape'?selected.id:null)}</div>`).join('')}</div>`;
    $('#assembly-overview').innerHTML = model.shapes.length ? `<section class="assembly-section"><div class="assembly-heading"><h3>${groups.length?'Sammensatte figurer':'Din figursamling'}</h3><div class="segmented" role="group" aria-label="Figurvisning"><button data-action="geometry-view" data-mode="3d" aria-pressed="${geometryView==='3d'}">3D</button><button data-action="geometry-view" data-mode="sketch" aria-pressed="${geometryView==='sketch'}">Skitse</button></div></div><p class="geometry-caption">Skematisk visning · ikke målfast. Separate figurer vises ved siden af hinanden.</p>${viewer}${groups.length?`<div class="joint-list">${joints.map(c=>{
      const a=E.faceInfo(model,c.a.shape,c.a.face),b=E.faceInfo(model,c.b.shape,c.b.face);
      return `<div><span>${esc(a.shape.name)} · ${esc(a.info.label)} <span aria-hidden="true">↔</span> ${esc(b.shape.name)} · ${esc(b.info.label)}</span><button class="text-button" data-action="disconnect" data-id="${esc(c.id)}">Skil ad</button></div>`;
    }).join('')}</div>`:'<p class="assembly-hint">Sæt fx en halvkugle på cylinderens bund. Fælles endeflader udelades automatisk fra overfladearealet.</p>'}${included.length?`<details class="assembly-totals" data-detail-key="assembly-totals"><summary>Rumfang og pladeareal for valgte beholderdele</summary>${summaries}<p class="field-note">Rumfang og pladeareal bruger indvendige mål. Åbne ender og samlinger er udeladt fra pladearealet. T9 er skolens tyndplademodel.</p></details>`:''}</section>` : '';
    if(model.shapes.length&&geometryView==='3d')preview3D=window.PPSolidPreview.mount($('.model-viewer-canvas'),model,selected?.type==='shape'?selected.id:null,previewPose);
  }
  function renderPreview(ctx) {
    const f = active();
    if (!f) {
      $('#formula-preview').innerHTML = '<div class="empty-preview"><span class="large-function">ƒ</span><h2>Find din næste formel</h2><p>Vælg, hvad du vil finde. Tilpas derefter formlens dele til det, du kender fra opgaven.</p><button class="button primary" data-action="add-formula">Vælg en formel</button></div>';
      $('#formula-chain').innerHTML = ''; $('#symbol-guide').innerHTML = ''; return;
    }
    const r = ctx.safe(`formula:${f.id}`,expanded ? 'expanded' : 'compact',true);
    const full = ctx.safe(`formula:${f.id}`);
    const definition=f.expression.kind==='formula'?E.FORMULAS[f.expression.formula]:null;
    const source=schoolRef(definition);
    let note=definition?.note||'';
    if (f.expression.kind === 'assembly') note = f.dimension === 'volume' ? 'Geometrisk rumfang af de valgte dele. Åbne sider ændrer ikke rumfanget; delene må ikke overlappe.' : 'Åbne flader og endeflader i samlinger er automatisk udeladt.';
    $('#formula-preview').innerHTML = `<div class="preview-header"><div><span class="eyebrow">DIN FORMEL</span><h2>${esc(f.name)}</h2></div><div class="segmented" role="group" aria-label="Udfoldning af formlen"><button data-action="expansion" data-expanded="false" aria-pressed="${!expanded}">Kort</button><button data-action="expansion" data-expanded="true" aria-pressed="${expanded}">Udfoldet</button></div></div><div class="formula-display">${r.ok ? E.math(r.ast,f.symbol,E.resultUnit(f).label) : `<div class="error-box">${esc(r.error)}</div>`}</div><div class="preview-footer"><span>${expanded ? 'Formlerne er sat ind i hinanden' : 'Referencer vises som symboler'}</span><button class="text-button copy-button" data-action="copy-formula" ${r.ok ? '' : 'disabled'}>${icon('copy')} Kopiér formel</button></div>${note ? `<p class="formula-assumption">${esc(note)}</p>` : ''}${source?`<p class="formula-source">Skolens formelsamling · ${esc(source)}</p>`:''}`;
    let steps;
    try { steps = ctx.steps(`formula:${f.id}`); } catch (_) { steps = []; }
    $('#formula-chain').innerHTML = steps.length ? `<details class="chain-details" data-detail-key="chain-${esc(f.id)}"><summary><span>Se formelkæden</span><span class="chain-count">${steps.length} ${steps.length === 1 ? 'formel' : 'formler'}</span></summary><ol class="chain-list">${steps.map(d => `<li><div class="chain-step-heading"><span>${esc(d.name)}</span><button class="text-button" data-action="inspect-reference" data-target="${esc(d.target)}">Tilpas</button></div><div class="chain-math">${formulaSummary(d.expression,d.dimension,ctx,d.symbol)}</div></li>`).join('')}</ol></details>` : '';
    if (!full.ok) { $('#symbol-guide').innerHTML = ''; return; }
    renderUnitGuide(full.ast,f);
  }
  function unitOptions(dimension,selected) {
    return E.Units.choices(dimension).map(u=>`<option value="${esc(u.id)}" ${u.id===selected?'selected':''}>${esc(u.label)}</option>`).join('');
  }
  function unitSelector(dimension,unit,action,id,symbol='') {
    const ratio=E.Units.ratio(dimension),result=action==='result-unit';
    const label=result?'Resultatets enhed':`Din enhed for ${pretty(symbol)} · ${E.DIMENSIONS[dimension].name}`;
    const attributes=`data-id="${esc(id)}" data-dimension="${esc(dimension)}"${symbol?` data-symbol="${esc(symbol)}"`:''}`;
    if(!ratio)return `<div class="unit-choice"><select ${result?'id="result-unit"':''} class="unit-select" data-action="${action}" ${attributes} aria-label="${esc(label)}">${unitOptions(dimension,unit.id)}</select></div>`;
    const labelledPart=ratio.numerator.length>1?'numerator':'denominator';
    const selectPart=part=>{
      const options=ratio[part].map(u=>{
        const name=part==='denominator'&&ratio.groupDenominator?'('+u.label+')':u.id==='ton'?'t (ton)':u.label;
        return `<option value="${esc(u.id)}" ${u.id===unit.parts[part]?'selected':''}>${esc(name)}</option>`;
      }).join('');
      return `<select ${result&&part===labelledPart?'id="result-unit"':''} class="unit-select" data-action="${action}-part" ${attributes} data-part="${part}" aria-label="${esc(label)} · ${part==='numerator'?'tæller':'nævner'}" ${ratio[part].length===1?'disabled':''}>${options}</select>`;
    };
    return `<div class="unit-choice unit-fraction" role="group" aria-label="${esc(label)}">${selectPart('numerator')}<span class="unit-slash" aria-hidden="true">/</span>${selectPart('denominator')}</div>`;
  }
  function renderUnitGuide(ast,f) {
    const vars=E.variables(ast),output=E.resultUnit(f),base=E.Units.base(f.dimension);
    $('#symbol-guide').innerHTML=`<div class="guide-heading"><h2>Størrelserne i formlen</h2><span>Din enhed → formlens enhed</span></div><p class="unit-intro">Vælg enhederne fra opgaven. I fx kg/h vælger du tæller og nævner hver for sig. Omregningerne indsættes i formlen, så du kan bruge de oplyste tal direkte.</p><dl class="symbol-list unit-symbol-list">${vars.map(v=>{
      const unit=E.inputUnit(model,v),expected=E.Units.base(v.dimension);
      return `<div><dt>${symbolHtml(v.symbol)}<span>${esc(v.label||E.DIMENSIONS[v.dimension].name)}</span></dt><dd><div class="unit-pair">${unitSelector(v.dimension,unit,'input-unit',E.Units.key(v),v.symbol)}<span class="unit-target"><span aria-hidden="true">→</span> ${esc(expected.label)}</span></div><span class="unit-operation">${esc(E.Units.hint(unit))}</span></dd></div>`;
    }).join('')}</dl><div class="result-unit-row"><div><label for="result-unit">Resultatets enhed</label><p>${symbolHtml(f.symbol)}<span>Vælg enheden for svaret</span></p></div><div><div class="unit-pair"><span class="unit-target">${esc(base.label)} <span aria-hidden="true">→</span></span>${unitSelector(f.dimension,output,'result-unit',f.id)}</div><span class="unit-operation">${esc(E.Units.hint(output,'fromBase'))}</span></div></div><p class="unit-footnote">Samme symbol bruger samme inputenhed i hele opsætningen. Resultatenheden vælges for hver formel. Valgene følger med, når du gemmer.</p>`;
  }
  function expressionEditor(expr, dimension, path, defaultSymbol, ctx, depth = 0) {
    if (depth > 12) return '<div class="error-box">Formlen er for dyb til at blive vist.</div>';
    const current = expr.kind === 'symbol' ? 'symbol' : expr.kind === 'assembly' ? 'assembly' : expr.kind === 'zero' ? 'zero' : expr.kind + ':' + (expr.formula || expr.target);
    const owner = ownerTarget(path);
    const targets = ctx.list.filter(d => d.dimension === dimension && d.target !== owner && !E.dependsOn(model,d.target,owner));
    let options = `<option value="symbol">Kendt størrelse · ${esc(pretty(defaultSymbol))}</option>`;
    if(expr.kind==='zero')options+='<option value="zero">Ingen valgte flader · 0</option>';
    if (['volume','area'].includes(dimension)) options += `<option value="assembly">Fra beholderdelene · samlet ${dimension === 'volume' ? 'rumfang' : 'areal'}</option>`;
    const formulas = Object.entries(E.FORMULAS).filter(([,f]) => f.dimension === dimension);
    if (formulas.length) options += '<optgroup label="Indsæt en formel">' + formulas.map(([id,f]) => `<option value="formula:${id}">${esc(f.equation)} · ${esc(formulaTitle(f))}</option>`).join('') + '</optgroup>';
    if (targets.length) options += '<optgroup label="Brug en reference">' + targets.map(d => `<option value="ref:${esc(d.target)}">↗ ${esc(d.name)}</option>`).join('') + '</optgroup>';
    if (expr.kind === 'ref' && !targets.some(d => d.target === expr.target)) options += `<option value="${esc(current)}">↗ ${esc(ctx.map.get(expr.target)?.name || 'Manglende reference')}</option>`;
    options = options.replace(`value="${esc(current)}"`,`value="${esc(current)}" selected`);
    let html = `<div class="expression"><select class="source-select" data-action="source" data-path="${pathAttr(path)}" data-dimension="${dimension}" data-symbol="${esc(defaultSymbol)}" aria-label="Kilde til ${esc(pretty(defaultSymbol))}">${options}</select>`;
    if (expr.kind === 'symbol') html += `<div class="known-symbol">${symbolHtml(expr.symbol)}<span>Behold den oplyste størrelse</span></div>`;
    else if(expr.kind==='zero')html+='<p class="field-note">Alle figurens flader er åbne eller sammenføjede.</p>';
    else if (expr.kind === 'ref') {
      const source = ctx.map.get(expr.target);
      html += `<div class="reference-preview">${source ? formulaSummary(source.expression,source.dimension,ctx,source.symbol) : '<p class="inline-error">Vælg en ny reference.</p>'}</div>${source ? `<div class="reference-actions"><button class="text-button" data-action="inspect-reference" data-target="${esc(source.target)}">Tilpas kilde</button>${source.expression.kind !== 'symbol' ? `<button class="text-button" data-action="inline" data-path="${pathAttr(path)}" title="Indsætter en kopi af kildens formel, som du kan tilpasse her">Indsæt formlen her</button>` : ''}</div>` : ''}`;
    } else if (expr.kind === 'assembly') {
      html += `<div class="reference-preview">${formulaSummary(expr,dimension,ctx)}</div><p class="field-note">Følger de figurer, der er valgt som beholderdele.${dimension === 'area' ? ' Åbne flader og endeflader i samlinger udelades automatisk.' : ''}</p>`;
    } else {
      const f = E.FORMULAS[expr.formula];
      html += `<div class="expression-formula">${formulaSummary(expr,dimension,ctx)}</div><div class="formula-args">${Object.entries(f.args).map(([key,a]) => `<div class="input-group"><div class="input-label">${symbolHtml(a.symbol)}<span>${esc(a.label)}</span></div>${expressionEditor(expr.args[key],a.dimension,[...path,'args',key],a.symbol,ctx,depth+1)}</div>`).join('')}</div>`;
      if (depth && f.note) html += `<p class="field-note">${esc(f.note)}</p>`;
    }
    try { ctx.expand(expr,dimension,'expanded',[owner]); }
    catch (error) { html += `<p class="inline-error" role="status">${esc(error.message)}</p>`; }
    return html + '</div>';
  }
  function inspectorHeader(type, object, subtitle) {
    return `<div class="inspector-top"><span class="eyebrow">${type === 'shape' ? 'TILPAS FIGUREN' : 'TILPAS FORMLENS DELE'}</span><div class="inspector-heading"><div class="inspector-icon">${type === 'shape' ? shapeIcon(object.type) : symbolHtml(object.symbol)}</div><div style="min-width:0;flex:1"><input class="inspector-title" value="${esc(object.name)}" data-action="rename" data-type="${type}" data-id="${esc(object.id)}" maxlength="120" aria-label="${type === 'shape' ? 'Figurens' : 'Formlens'} navn"><p>${esc(subtitle)}</p></div></div></div>`;

  function diameterEditor(s,index,ctx) {

    catch(_) {
      const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();let success=false;
      try{success=document.execCommand('copy');}catch(_){}area.remove();
      if(success)notify('Formlen er kopieret.');
      else openDialog('Kopiér formlen',`<p>Markér teksten og tryk Ctrl+C:</p><textarea class="copy-fallback" readonly aria-label="Formel til kopiering">${esc(text)}</textarea>`);
    }
  }
  function showHelp() {
    openDialog('Sådan bruger du kompendiet','<h3>Fra opgave til formel</h3><ol><li>Vælg, hvad du vil finde, fx fyldetid, rumfang eller flow.</li><li>Indsæt de figurer, opgaven består af. Vælg, hvilke der indgår i beholderen.</li><li>Ved hver størrelse vælger du <strong>Kendt størrelse</strong>, en <strong>formel</strong> eller en <strong>reference</strong>. Du beholder de størrelser, du kender, som symboler.</li><li>Skift mellem <strong>Kort</strong> og <strong>Udfoldet</strong>, og se den samlede formel. Under <strong>Se formelkæden</strong> kan du følge de enkelte formler.</li></ol><h3>Eksempel: bassin med keglebund</h3><p>Fyldetiden bruger t = V / Qᵥ. Rumfanget hentes fra cylinder + keglebund. Flowet kan beholdes som Qᵥ, eller foldes ud til A · v, hvor A kommer fra rørets diameter. Klik på keglebunden for at se dens fælles diameter med cylinderen.</p><h3>Figurer og symboler</h3><p>Hver figur får et nummer. D₁ er diameteren på figur 1, h₂ er højden på figur 2. En reference følger kilden, når du ændrer den. <strong>Indsæt formlen her</strong> kopierer kildens aktuelle formel, så du kan tilpasse den herfra.</p><h3>Sammensæt og se figurerne</h3><p>Tryk <strong>Sammensæt</strong>, vælg en figur og en fri endeflade, og sæt en eksisterende eller ny figur på. Brug fx en <strong>halvkugle</strong> som kuglespids på en cylinder. Delene får fælles mål, og deres samleflader fjernes automatisk fra pladearealet. Hele samlingen indgår i beholderens sum, når den er valgt.</p><p>I <strong>3D</strong> kan du trække for at dreje og scrolle for at zoome. Du kan også bruge piletasterne samt + og −, når visningen har fokus. <strong>Skitse</strong> viser fladernes navne og status. Begge visninger er skematiske og uden målestok.</p><p>Vælg en figur for at sætte hver fri flade til <strong>Åben</strong> eller <strong>Lukket</strong>. Valget ændrer overfladeformlen, mens det geometriske rumfang er det samme. Brug <strong>Skil ad</strong> til at løsne en samling eller <strong>Fjern</strong> under figurens kort til at slette den. Samlede rumfang og arealer findes under visningen. Rumfang må kun summeres for dele, der ikke overlapper.</p><h3>Indvendig eller udvendig diameter</h3><p>Vælg figuren og angiv, om diameteren er <strong>indvendig</strong> eller <strong>udvendig</strong>. Rumfang, flow og pladeareal bruger indvendige mål. En udvendig diameter omregnes som <strong>Dindre = (Dydre − 2 · tradial)</strong>. Højde og længde skal fortsat være indvendige mål. Samlede figurer deler den indvendige diameter, så godstykkelsen ikke trækkes fra to gange.</p><p>Cylinder, rør og kugledele bruger som standard samme pladetykkelse som T9. På kegler og keglestubbe angives radial godstykkelse ved endefladen særskilt; den er forskellig fra tykkelsen vinkelret på den skrå plade. T9 er fortsat skolens tyndplademodel med indvendigt pladeareal.</p><h3>Enheder i opgaven og i resultatet</h3><p>Under <strong>Størrelserne i formlen</strong> vælger du den enhed, opgaven giver for hvert kendt symbol. Brøkenheder har to dropdowns: vælg tæller og nævner hver for sig, fx <strong>t (ton) / m³</strong>, <strong>kg / h</strong> eller <strong>mg / min</strong>. Det gælder også resultatets enhed. Fx giver <strong>mm → m</strong> division med 1000 inde i formlen. Du skal derefter bruge tallet fra opgaven uden først at omregne det. Areal- og rumfangsenheder får deres egne faktorer.</p><p>Vælg <strong>Resultatets enhed</strong> nederst, fx liter, minutter, ton eller kW. Hele resultatet omregnes med parenteser. Procent kan vælges for forhold som virkningsgrad. °C omregnes til K for temperaturer; en temperaturforskel i °C har samme tal som i K.</p><p>Samme symbol og størrelse har samme inputenhed i hele opsætningen. Hver formel har sin egen resultatenhed. Referencer omregnes én gang, og kopieret tekst viser de valgte enheder. Ændringer i enheder viser automatisk den udfoldede formel.</p><h3>Offline og gemte opsætninger</h3><p>Åbn <strong>index.html</strong> fra den downloadede mappe. Den indeholder hele kompendiet og virker uden installation, internet, login eller AI. Der er ingen talindtastning eller udregning af resultater.</p><p><strong>Gem opsætning</strong> henter en fil med dine figurer og formelvalg. Åbn den igen med <strong>Åbn opsætning</strong>. Gem som fil, før du flytter til en anden computer; browserens lokale lagring er en ekstra bekvemmelighed.</p><p>Formlerne omfatter geometri, overflade, flow, tid, masse, tryk og pumpeeffekt. Følg opgavens forudsætninger og brug ensartede enheder.</p>');
  }
  const tutorialSteps = [
    {section:'OVERBLIK', title:'Velkommen til kompendiet', target:'.help-button', scene:'parts', body:'<p>Her får du en rundtur fra figurer til den færdige formel. Tryk <strong>Næste</strong> for at fortsætte; du behøver ikke betjene felterne undervejs.</p><p>Vi viser et midlertidigt bassin-eksempel. Når du afslutter, kommer din egen opsætning tilbage. Du kan altid starte igen med <strong>?</strong>.</p>'},
    {section:'FIGURER', title:'Indsæt de figurer, du skal bruge', target:'#shape-library', scene:'parts', body:'<p>Tryk på en figur i værktøjskassen for at indsætte den. Du kan fx bygge en tank af en <strong>cylinder</strong> og en <strong>kegle</strong>.</p><p>En <strong>halvkugle</strong> bruges som kuglespids. Et rør kan bruges til tværsnittet i en flowformel. Du kan også arbejde med formler helt uden figurer.</p>'},
    {section:'FIGURER', title:'Vælg, tilpas eller fjern en figur', target:'#figure-tray', scene:'parts', focus:'cylinder', body:'<p>Tryk på figurens kort for at åbne dens indstillinger i panelet <strong>Tilpas figuren</strong>. Nummeret knytter dens symboler til figuren: D₁ og h₁ hører fx til figur 1.</p><p><strong>Fjern</strong> under kortet sletter figuren og løsner dens samlinger. Eventuelle direkte referencer til den skal derefter have en ny kilde.</p>'},
    {section:'FIGURER', title:'Hvad skal tælles med i beholderen?', target:'.include-choice', scene:'parts', focus:'pipe', body:'<p><strong>Indgår i beholderens sum</strong> bestemmer, hvilke dele der bidrager til tankens samlede rumfang og pladeareal.</p><p>Her er indløbsrøret fravalgt. Vi bruger dets tværsnit til flow, men tæller det ikke med i bassinet. For sammenføjede dele gælder valget hele samlingen.</p>'},
    {section:'FIGURER', title:'Vælg indvendig eller udvendig diameter', target:'.diameter-settings', scene:'parts', focus:'cylinder', body:'<p>Angiv, om opgavens diameter er <strong>indvendig</strong> eller <strong>udvendig</strong>. Ved et udvendigt mål vælger du også godstykkelsen, så den indvendige diameter kan udtrykkes korrekt.</p><p>Rumfang og flow bruger indvendige mål. Højde og længde skal fortsat være indvendige. Sammenføjede dele deler deres indvendige mål.</p>'},
    {section:'FIGURER', title:'Åbn eller luk toppen', target:'.face-list', scene:'parts', focus:'cylinder', body:'<p>Hver fri flade har en menu med <strong>Åben</strong> og <strong>Lukket</strong>. Her er cylinderens top åben. Vælger du Lukket, lægges toppladens areal til.</p><p>Valget ændrer <strong>pladearealet</strong> og dermed fx materialemassen. Figurens geometriske rumfang er det samme. En sammenføjet flade styres af samlingen.</p>'},
    {section:'SAMLINGER', title:'Forbind to figurer', target:'.join-button', scene:'parts', focus:'cylinder', body:'<p>Tryk <strong>Sammensæt</strong> for at sætte en figur på en anden. Du kan også vælge <strong>Sæt figur på denne ende</strong> ved en fri flade i figurens indstillinger.</p><p>På næste trin viser vi menuen med cylinderens bund og keglebunden valgt.</p>'},
    {section:'SAMLINGER', title:'Vælg figur, ende og endestykke', target:'.join-fields', scene:'join', focus:'cylinder', body:'<p>Vælg først <strong>Cylinder</strong>, derefter <strong>Bund</strong> og til sidst <strong>Keglebund · Plan endeflade</strong>. Tryk normalt <strong>Sæt sammen</strong> for at forbinde dem.</p><p>Menuen tilbyder både eksisterende figurer og nye endestykker, fx <strong>Ny halvkugle</strong>. Kun passende, ledige samleflader kan vælges. Vi viser resultatet på næste trin.</p>'},
    {section:'SAMLINGER', title:'Se den samlede figur i 3D', target:'.solid-viewer', body:'<p>Nu sidder keglen på cylinderens bund. Træk i <strong>3D-visningen</strong> for at dreje den; brug scroll eller +/− til zoom. <strong>Skitse</strong> viser et snit med fladernes navne.</p><p>Visningen følger samlinger og åbne/lukkede flader. Den er skematisk og uden målestok.</p>'},
    {section:'SAMLINGER', title:'Fælles flader og samlede formler', target:'.assembly-totals', detail:'assembly-totals', body:'<p>Her finder du det samlede <strong>rumfang</strong> og <strong>pladeareal</strong>. Åbne flader og de to endeflader i en samling udelades automatisk fra pladearealet. <strong>Brug formel</strong> føjer summen til Mine formler.</p><p><strong>Skil ad</strong> under visningen løsner samlingen. Delene får deres egne mål og fladevalg tilbage. Sum af rumfang forudsætter, at delene ikke overlapper.</p>'},
    {section:'FORMLER', title:'Vælg, hvad du vil finde', target:'.goal-row', body:'<p>Her vælger du hovedformlen. I eksemplet vil vi finde <strong>Fyldetid</strong>: t = V / Qᵥ.</p><p>Menuen viser både dine egne formler og muligheden for at tilføje en ny. Figurerne leverer fx rumfanget V, mens en anden formel kan levere volumenflowet Qᵥ.</p>'},
    {section:'FORMLER', title:'Find formler fra formelsamlingen', target:'.formula-search', scene:'library', body:'<p>Fanen <strong>Formelsamling</strong> samler formlerne fra jeres materiale. Søg på et navn, symbol eller T-nummer, fx <strong>Pvirk</strong>, <strong>eta</strong> eller <strong>T9</strong>.</p><p>Kortene viser formlen, forudsætninger og henvisning til siden i jeres samling. Tryk <strong>Brug formel</strong> for at arbejde videre med den.</p>'},
    {section:'FORMLER', title:'Gem delformler, der kan bruges igen', target:['#saved-formulas','.goal-row'], body:'<p><strong>Mine formler</strong> samler opsætningens delformler. Her har vi rumfang, volumenflow og fyldetid. På en smal skærm vælger du dem i <strong>Hvad vil du finde?</strong>.</p><p>Brug <strong>Tilføj formel</strong> til nye delformler, og giv dem et genkendeligt navn i tilpasningspanelet. De kan derefter vælges som referencer.</p>'},
    {section:'REFERENCER', title:'Tilpas hver del af formlen', target:'#inspector .formula-args > .input-group:nth-child(2)', scene:'known', body:'<p>Menuen ved hver størrelse giver dig tre muligheder: <strong>Kendt størrelse</strong>, <strong>Indsæt en formel</strong> eller <strong>Brug en reference</strong>.</p><p>Her er Qᵥ en kendt størrelse: du har allerede flowet fra opgaven. Hvis du i stedet kender areal og hastighed, kan du vælge formlen Qᵥ = A · v. Menuen viser kilder med den rigtige størrelse.</p>'},
    {section:'REFERENCER', title:'En reference følger sin kilde', target:'#inspector .formula-args > .input-group:nth-child(2)', body:'<p>Nu henter Qᵥ sin formel fra <strong>Volumenflow</strong> i Mine formler. Ændrer du kilden, følger fyldetiden automatisk med. <strong>Tilpas kilde</strong> åbner kildens indstillinger.</p><p>Volumenflowets A henviser videre til rørets tværsnit. På samme måde henter V bassindelenes samlede rumfang. Du kan altså bygge en kæde af referencer.</p>'},
    {section:'REFERENCER', title:'Indsæt en formel direkte', target:'#inspector .formula-args > .input-group:nth-child(2)', scene:'inline', body:'<p>Ved en reference vælger du <strong>Indsæt formlen her</strong>, hvis du vil have en kopi, som kan tilpasses på stedet. Her er Qᵥ = A · v nu indsat direkte under fyldetiden.</p><p>Kopien følger ikke længere selve Volumenflow-formlen. Dens underreferencer, fx A fra røret, følger stadig deres egne kilder. Du kan også vælge en formel direkte i dropdownen.</p>'},
    {section:'RESULTAT', title:'Se den færdige formel', target:'#formula-preview', body:'<p><strong>Kort</strong> viser referencer som symboler. <strong>Udfoldet</strong> sætter delformlerne ind i hinanden, som vist her. Parenteserne holder summer, brøker og potenser samlet.</p><p><strong>Kopiér formel</strong> tager den viste formel og de valgte enheder med. Kompendiet hjælper dig med udtrykket; du indsætter opgavens tal, når du selv regner videre.</p>'},
    {section:'RESULTAT', title:'Følg formlen hele vejen tilbage', target:'.chain-details', detail:'chain-time', body:'<p>Åbn <strong>Se formelkæden</strong> for at følge delformlerne bag resultatet: fra rørets tværsnit til volumenflow og videre til fyldetid.</p><p><strong>Tilpas</strong> ved et led åbner dets indstillinger. Det gør det nemt at finde det sted, hvor en størrelse eller reference skal ændres.</p>'},
    {section:'ENHEDER', title:'Vælg præcis de enheder, du har', target:'.unit-symbol-list > div:last-child', scene:'units', body:'<p>Under <strong>Størrelserne i formlen</strong> vælger du opgavens enhed for hvert symbol. Fx giver <strong>mm → m</strong> den nødvendige division med 1000 inde i formlen.</p><p>For brøkenheder vælger du <strong>tæller og nævner hver for sig</strong>, som L/min her. Det virker også for fx t/m³ og kg/h i de relevante formler. Omregningen skal ikke tilføjes igen.</p>'},
    {section:'ENHEDER', title:'Vælg enheden for svaret', target:'.result-unit-row', scene:'units', body:'<p><strong>Resultatets enhed</strong> bestemmer, hvordan det samlede udtryk skal omregnes. Her er fyldetiden valgt i <strong>minutter</strong>. Andre formler tilbyder fx liter, ton og kW.</p><p>Inputenheder følger samme symbol i hele opsætningen. Hver formel har sin egen resultatenhed. Dine enhedsvalg kommer med, når du gemmer eller kopierer.</p>'},
    {section:'GEM OG FORTSÆT', title:'Klar til din egen opgave', target:'.top-actions', body:'<p><strong>Gem opsætning</strong> henter en fil med dine figurer, formler og enhedsvalg. Brug <strong>Åbn opsætning</strong> til at hente den ind igen, også på en anden computer. Sol/måne-knappen skifter mellem lyst og mørkt tema.</p><p>Hele kompendiet og denne guide virker offline. Tryk <strong>Afslut introduktion</strong> for at vende tilbage til din egen opsætning. <strong>?</strong> starter guiden igen.</p>'}
  ];
  function prepareTutorialStep(step) {
    if ($('#app-dialog').open) closeDialog();
    model = E.example();
    model.title = 'Introduktion · bassin med keglebund';
    model.shapes.find(s=>s.id==='cylinder').faces.top = 'open';
    if (['parts','join'].includes(step.scene)) model.connections = [];
    if (['known','units'].includes(step.scene)) model.formulas.find(f=>f.id==='time').expression.args.Q = E.symbol('Q_v');
    if (step.scene === 'inline') model.formulas.find(f=>f.id==='time').expression.args.Q = E.clone(model.formulas.find(f=>f.id==='flow').expression);
    if (step.scene === 'units') {
      model.inputUnits = {'D_1:length':'mm','Q_v:flow':'L_min'};
      model.formulas.find(f=>f.id==='time').resultUnit = 'min';
    }
    activeId = 'time';
    selected = step.focus ? {type:'shape',id:step.focus} : {type:'formula',id:'time'};
    expanded = true; geometryView = '3d'; libraryQuery = step.scene === 'library' ? 'Pvirk' : '';
    changeView(step.scene === 'library' ? 'library' : 'builder');
    render();
    for (const detail of document.querySelectorAll('details[data-detail-key]')) detail.open = detail.dataset.detailKey === step.detail;
    $('#inspector').scrollTop = 0;
    $('#save-status').textContent = 'Introduktion · midlertidigt eksempel';
    if (step.scene === 'join') {
      openJoin('cylinder','bottom');
      joinDraft.target = 'existing:cone:base';
      $('#app-dialog').querySelector('.dialog-body').innerHTML = joinFields();
    }
    const selectors = Array.isArray(step.target) ? step.target : [step.target];
    return () => selectors.map(selector=>document.querySelector(selector)).find(element=>element?.getClientRects().length) || $('.help-button');
  }
  function finishTutorial() {
    const previous = tutorial;
    if (!previous) return;
    if ($('#app-dialog').open) closeDialog();
    if (preview3D) {preview3D.destroy(); preview3D=null;}
    tutorial = null;
    ({model,activeId,selected,expanded,geometryView,previewPose,libraryQuery} = previous);
    changeView(previous.view); render();
    for (const detail of document.querySelectorAll('details[data-detail-key]')) detail.open = previous.details.includes(detail.dataset.detailKey);
    $('#save-status').textContent = previous.saveStatus;
    $('#inspector').scrollTop = previous.inspectorTop;
    $('#inspector').scrollLeft = previous.inspectorLeft;
    window.scrollTo({left:previous.scrollX,top:previous.scrollY,behavior:'instant'});
    (previous.origin?.isConnected ? previous.origin : $('.help-button')).focus({preventScroll:true});
  }
  function startTutorial() {
    if (tutorial) return;
    tutorial = {model,activeId,selected,view,expanded,geometryView,previewPose:preview3D?.getPose()||previewPose,libraryQuery,
      origin:document.activeElement,scrollX:window.scrollX,scrollY:window.scrollY,
      inspectorTop:$('#inspector').scrollTop,inspectorLeft:$('#inspector').scrollLeft,
      saveStatus:$('#save-status').textContent,
      details:[...document.querySelectorAll('details[open][data-detail-key]')].map(d=>d.dataset.detailKey)};
    clearTimeout(toastTimer); $('#toast').hidden = true;
    try { window.PPTour.start({steps:tutorialSteps,prepare:prepareTutorialStep,finish:finishTutorial,help:showHelp}); }
    catch (_) { finishTutorial(); notify('Introduktionen kunne ikke åbnes. Din opsætning er bevaret.'); }
  }
  document.addEventListener('click',event=>{
    if (tutorial) return;
    const tab=event.target.closest('[data-view]');if(tab){changeView(tab.dataset.view);return;}
    const b=event.target.closest('[data-action]');if(!b)return;
    const a=b.dataset.action;
    if(a==='theme'){theme=theme==='dark'?'light':'dark';setTheme();try{localStorage.setItem(THEME,theme);}catch(_){}}
    else if(a==='select-formula')select('formula',b.dataset.id,true);
    else if(a==='select-shape')select('shape',b.dataset.id,true);
    else if(a==='add-shape')addShape(b.dataset.type);
    else if(a==='geometry-view'){geometryView=b.dataset.mode;render(true);}
    else if(a==='zoom-in')preview3D?.zoom(1.2);
    else if(a==='zoom-out')preview3D?.zoom(1/1.2);
    else if(a==='reset-camera')preview3D?.reset();
    else if(a==='join')openJoin(b.dataset.id,b.dataset.face);
    else if(a==='confirm-join')commitJoin();
    else if(a==='disconnect'){model=E.disconnect(model,b.dataset.id);save();render();notify('Figurerne er skilt ad. Frie ender og egne mål er gendannet.');}
    else if(a==='use-assembly')useAssembly(b.dataset.dimension);
    else if(a==='edit-tank')select('tank','tank',true);
    else if(a==='inspect-face'){
      select('shape',b.dataset.id,true);
      const row=[...document.querySelectorAll('[data-face-row]')].find(el=>el.dataset.faceRow===b.dataset.face);
      row?.querySelector('select,button')?.focus({preventScroll:true});
    }
    else if(a==='add-formula')formulaPicker();
    else if(a==='use-formula'){if($('#app-dialog').open)closeDialog();addFormula(b.dataset.formula);}
    else if(a==='expansion'){expanded=b.dataset.expanded==='true';render(true);}
    else if(a==='back-to-formula'){if(activeId)select('formula',activeId,true);}
    else if(a==='inspect-reference')inspectReference(b.dataset.target);
    else if(a==='inline'){
      const path=JSON.parse(b.dataset.path),old=E.clone(getAt(path)),d=E.context(model).map.get(old.target);
      if(d){setAt(path,E.clone(d.expression));try{E.validateModel(model);save();render();notify('Formlen er indsat som en kopi. Dens underreferencer er bevaret.');}catch(_){setAt(path,old);notify('Formlen bliver for dyb. Behold referencen.');}}
    }
    else if(a==='delete')remove(b.dataset.type,b.dataset.id);
    else if(a==='export')exportSetup();
    else if(a==='import')$('#file-input').click();
    else if(a==='copy-formula')void copyFormula();
    else if(a==='new')replaceSetup({version:5,inputUnits:{},title:'Ny opsætning',tank:E.defaultTank(),shapes:[],formulas:[],connections:[]},'Start en tom opsætning?');
    else if(a==='example')replaceSetup(E.example(),'Indlæs bassin-eksemplet?');
    else if(a==='tutorial')startTutorial();
    else if(a==='close-dialog')closeDialog();
    else if(a==='confirm'){const action=pending;closeDialog();if(action)action();}
    else if(a==='help')showHelp();
  });
  document.addEventListener('change',event=>{
    if (tutorial) return;
    const el=event.target,a=el.dataset.action;
    if(a==='join-host'||a==='join-face'||a==='join-target'){
      if(!joinDraft)return;
      joinDraft[a==='join-host'?'host':a==='join-face'?'face':'target']=el.value;
      if(a!=='join-target'){
        $('#app-dialog').querySelector('.dialog-body').innerHTML=joinFields();
        [...$('#app-dialog').querySelectorAll('[data-action]')].find(e=>e.dataset.action===a)?.focus();
      }
      return;
    }
    if(el.id==='goal-select'){
      if(el.value.startsWith('saved:'))select('formula',el.value.slice(6));
      else if(el.value.startsWith('new:'))addFormula(el.value.slice(4));return;
    }
    if(a==='input-unit'||a==='input-unit-part'){
      const variable={symbol:el.dataset.symbol,dimension:el.dataset.dimension},key=E.Units.key(variable);
      const unit=a==='input-unit-part'?E.Units.withPart(variable.dimension,E.inputUnit(model,variable).id,el.dataset.part,el.value):E.Units.get(variable.dimension,el.value);
      model.inputUnits||={};
      if(unit.id===E.Units.base(variable.dimension).id)delete model.inputUnits[key];else model.inputUnits[key]=unit.id;
      expanded=true;save();render(true);
    }else if(a==='result-unit'||a==='result-unit-part'){
      const f=model.formulas.find(f=>f.id===el.dataset.id);
      if(f){f.resultUnit=(a==='result-unit-part'?E.Units.withPart(f.dimension,E.resultUnit(f).id,el.dataset.part,el.value):E.Units.get(f.dimension,el.value)).id;expanded=true;save();render(true);}
    }else if(a==='source'){
      const path=JSON.parse(el.dataset.path),old=getAt(path);
      const next=el.value==='symbol'?E.symbol(el.dataset.symbol):el.value==='zero'?{kind:'zero',dimension:'area'}:el.value==='assembly'?E.assembly(el.dataset.dimension):el.value.startsWith('formula:')?E.newExpression(el.value.slice(8)):E.ref(el.value.slice(4));
      setAt(path,next);try{E.validateModel(model);save();render(true);}catch(_){setAt(path,old);render(true);notify('Formlen bliver for dyb. Tilføj en separat formel og brug en reference.');}
    }else if(a==='diameter-basis'){
      try{model=E.setDiameterBasis(model,el.dataset.id,el.value);save();render(true);}catch(error){render(true);notify(error.message);}
    }else if(a==='include'){E.setIncluded(model,el.dataset.id,el.checked);save();render(true);}
    else if(a==='face-state'){
      const shape=model.shapes.find(s=>s.id===el.dataset.id);
      if(shape&&!E.connectionAt(model,shape.id,el.dataset.face)){shape.faces[el.dataset.face]=el.value;save();render(true);}
    }
  });
  document.addEventListener('input',event=>{
    if (tutorial) return;
    const el=event.target;
    if(el.dataset.action==='search-formulas'){libraryQuery=el.value;renderLibraryResults();return;}
    if(el.id==='project-title'){model.title=el.value.trim()||'Ny opsætning';save();}
    else if(el.dataset.action==='rename'){
      const list=el.dataset.type==='shape'?model.shapes:model.formulas,item=list.find(o=>o.id===el.dataset.id);
      if(el.value.trim()){item.name=el.value;save();render(true);}
    }
  });
  $('#file-input').addEventListener('change',async event=>{
    const file=event.target.files[0];event.target.value='';if(!file)return;
    if(file.size>1000000){notify('Filen er for stor. Maksimum er 1 MB.');return;}
    try{const candidate=E.validateModel(JSON.parse(await file.text()));replaceSetup(candidate,'Åbn '+candidate.title+'?');}
    catch(error){openDialog('Opsætningen kunne ikke åbnes',`<p>${esc(error instanceof SyntaxError?'Filen er ikke gyldig JSON. Vælg en fil gemt fra kompendiet.':error.message)}</p>`);}
  });
  $('#app-dialog').addEventListener('cancel',()=>{pending=null;joinDraft=null;});
  document.addEventListener('keydown',event=>{
    if(['Enter',' '].includes(event.key)&&event.target.matches('svg [role="button"]')){
      event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));
    }
  });
  $('#app-dialog').addEventListener('click',event=>{if(event.target===$('#app-dialog')){const r=event.target.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeDialog();}});
  $('.brand').addEventListener('click',event=>{event.preventDefault();changeView('builder');});
  $('.view-tabs').addEventListener('keydown',event=>{
    if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();
    const tabs=[...document.querySelectorAll('[data-view]')],i=tabs.indexOf(document.activeElement),n=event.key==='Home'?0:event.key==='End'?tabs.length-1:(i+1)%tabs.length;
    changeView(tabs[n].dataset.view);tabs[n].focus();
  });
  setTheme();render();if(notice)notify(notice);
  // Deliberately no network requests, AI integration, or numeric evaluation.
})();

</script>
</body>
</html>
